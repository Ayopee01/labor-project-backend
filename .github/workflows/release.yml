name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Deploy one environment only.
        required: true
        type: choice
        options:
          - staging
          - production
      image_sha:
        description: Existing immutable image SHA tag to deploy.
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || inputs.target_environment }}
  cancel-in-progress: false

jobs:
  image-metadata:
    runs-on: ubuntu-24.04
    outputs:
      image_repository: ${{ steps.image.outputs.image_repository }}
    steps:
      - name: Normalize GHCR repository
        id: image
        env:
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
        run: |
          IMAGE_REPOSITORY="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_VALUE" | tr '[:upper:]' '[:lower:]')"
          echo "image_repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"

  validate-automatic-release:
    if: github.event_name == 'workflow_run'
    needs: image-metadata
    runs-on: ubuntu-24.04
    outputs:
      image_sha: ${{ steps.release.outputs.image_sha }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      app_image: ${{ steps.release.outputs.app_image }}
    steps:
      - name: Require trusted CI success on main
        id: release
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$CI_CONCLUSION" = "success"
          test "$CI_EVENT" = "push"
          test "$CI_BRANCH" = "main"
          echo "image_sha=$CI_SHA" >> "$GITHUB_OUTPUT"
          echo "release_sha=$CI_SHA" >> "$GITHUB_OUTPUT"
          echo "app_image=${{ needs.image-metadata.outputs.image_repository }}:sha-$CI_SHA" >> "$GITHUB_OUTPUT"

  build-image:
    needs:
      - image-metadata
      - validate-automatic-release
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-automatic-release.outputs.image_sha }}

      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push immutable image once
        id: meta
        env:
          IMAGE_SHA: ${{ needs.validate-automatic-release.outputs.image_sha }}
          APP_IMAGE: ${{ needs.validate-automatic-release.outputs.app_image }}
        run: |
          docker build \
            --target production \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${IMAGE_SHA}" \
            --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label org.opencontainers.image.version="${IMAGE_SHA}" \
            -t "$APP_IMAGE" \
            .
          docker push "$APP_IMAGE"
          docker tag "$APP_IMAGE" "${{ needs.image-metadata.outputs.image_repository }}:main"
          docker push "${{ needs.image-metadata.outputs.image_repository }}:main"
          echo "image=$APP_IMAGE" >> "$GITHUB_OUTPUT"

  deploy-staging:
    needs:
      - validate-automatic-release
      - build-image
    if: github.event_name == 'workflow_run'
    uses: ./.github/workflows/deploy-ssh.yml
    with:
      environment_name: staging
      app_image: ${{ needs.build-image.outputs.image }}
      release_sha: ${{ needs.validate-automatic-release.outputs.release_sha }}
      run_migrations: true

  deploy-production:
    needs:
      - validate-automatic-release
      - build-image
      - deploy-staging
    if: github.event_name == 'workflow_run'
    uses: ./.github/workflows/deploy-ssh.yml
    with:
      environment_name: production
      app_image: ${{ needs.build-image.outputs.image }}
      release_sha: ${{ needs.validate-automatic-release.outputs.release_sha }}
      run_migrations: true

  validate-manual-deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: image-metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      release_sha: ${{ steps.image.outputs.release_sha }}
      app_image: ${{ steps.image.outputs.app_image }}
    steps:
      - name: Validate existing image SHA input
        id: image
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          if ! printf '%s' "$IMAGE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "image_sha must be a full 40-character Git SHA." >&2
            exit 1
          fi
          echo "release_sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"
          echo "app_image=${{ needs.image-metadata.outputs.image_repository }}:sha-$IMAGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify image exists
        env:
          APP_IMAGE: ${{ steps.image.outputs.app_image }}
        run: docker manifest inspect "$APP_IMAGE" >/dev/null

  manual-deploy-staging:
    needs: validate-manual-deploy
    if: github.event_name == 'workflow_dispatch' && inputs.target_environment == 'staging'
    uses: ./.github/workflows/deploy-ssh.yml
    with:
      environment_name: staging
      app_image: ${{ needs.validate-manual-deploy.outputs.app_image }}
      release_sha: ${{ needs.validate-manual-deploy.outputs.release_sha }}
      run_migrations: true

  manual-deploy-production:
    needs: validate-manual-deploy
    if: github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production'
    uses: ./.github/workflows/deploy-ssh.yml
    with:
      environment_name: production
      app_image: ${{ needs.validate-manual-deploy.outputs.app_image }}
      release_sha: ${{ needs.validate-manual-deploy.outputs.release_sha }}
      run_migrations: true
