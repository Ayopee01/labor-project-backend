name: Deploy over SSH

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      app_image:
        required: true
        type: string
      release_sha:
        required: true
        type: string
      run_migrations:
        required: true
        type: boolean
permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Checkout deployment assets
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Validate immutable image reference and release SHA
        env:
          APP_IMAGE: ${{ inputs.app_image }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release_sha must be a full 40-character Git SHA." >&2
            exit 1
          fi
          if ! printf '%s' "$APP_IMAGE" | grep -Eq '^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+:sha-[0-9a-f]{40}$'; then
            echo "app_image must use an immutable sha-<40-char-sha> GHCR tag." >&2
            exit 1
          fi
          test "$APP_IMAGE" = "${APP_IMAGE%:sha-*}:sha-$RELEASE_SHA"

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload production compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          DEPLOY_TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_TARGET" "mkdir -p '$DEPLOY_PATH'"
          scp -P "$DEPLOY_PORT" docker-compose.prod.yml "$DEPLOY_TARGET:$DEPLOY_PATH/docker-compose.prod.yml"

      - name: Login to GHCR on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          DEPLOY_TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          printf '%s\n' "$GHCR_PULL_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_TARGET" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy immutable image and verify readiness
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_IMAGE: ${{ inputs.app_image }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
        run: |
          DEPLOY_TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_TARGET" \
            "cd '$DEPLOY_PATH' && \
            APP_IMAGE='$APP_IMAGE' docker compose --env-file .env.production -f docker-compose.prod.yml pull api && \
            if [ '$RUN_MIGRATIONS' = 'true' ]; then APP_IMAGE='$APP_IMAGE' docker compose --env-file .env.production -f docker-compose.prod.yml run --rm api npm run db:deploy; fi && \
            APP_IMAGE='$APP_IMAGE' docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans api redis && \
            for attempt in \$(seq 1 24); do \
              if APP_IMAGE='$APP_IMAGE' docker compose --env-file .env.production -f docker-compose.prod.yml exec -T api node -e \"fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"; then exit 0; fi; \
              sleep 5; \
            done; \
            echo 'Deployment readiness check failed for attempted image.' >&2; \
            echo 'APP_IMAGE=$APP_IMAGE' >&2; \
            exit 1"
