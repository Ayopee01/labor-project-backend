paths:
  /api/line/dev:
    get:
      tags:
        - LINE
      summary: เปิดหน้า LINE สำหรับ Dev Tester
      description: แสดงหน้า HTML สำหรับทดสอบการ confirm/reject แบบ Vendor LINE ใน environment ที่ไม่ใช่ production
      operationId: getLineDevPage
      responses:
        "200":
          description: LINE dev tester HTML.
          content:
            text/html:
              schema:
                type: string
        "404":
          description: LINE dev tester is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/line/dev/submissions:
    get:
      tags:
        - LINE
      summary: ดูรายการ submission สำหรับ Dev Tester
      description: คืนรายการ booth submission ที่รอ Vendor action เพื่อให้หน้าทดสอบเลือก confirm หรือ reject ได้
      operationId: listLineDevSubmissions
      responses:
        "200":
          description: LINE dev submission list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        "404":
          description: LINE dev tester is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/line/dev/submissions/{submissionId}/confirm:
    post:
      tags:
        - LINE
      summary: confirm submission สำหรับ Dev Tester
      description: ทดสอบ Vendor confirm โดยใช้ completion flow เดียวกับ LINE จริง แต่ไม่ส่งข้อความออกผ่าน Messaging API
      operationId: confirmLineDevSubmission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: LINE dev submission confirmed.
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Submission not found or LINE dev tester is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Submission was already handled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/line/dev/submissions/{submissionId}/reject:
    post:
      tags:
        - LINE
      summary: reject submission สำหรับ Dev Tester
      description: ทดสอบ Vendor reject พร้อมเหตุผล โดยใช้ completion flow เดียวกับ LINE จริง แต่ไม่ส่งข้อความออกผ่าน Messaging API
      operationId: rejectLineDevSubmission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reject_reason:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: LINE dev submission rejected.
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Submission not found or LINE dev tester is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Submission was already handled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/line/webhook:
    post:
      tags:
        - LINE
      summary: รับ webhook จาก LINE ของ Vendor
      description: รับ postback จากปุ่ม confirm, reject และ rating ใน LINE Flex message แล้วอัปเดตสถานะ ticket ตาม token ที่แนบมา ถ้างานครบทุก ticket ระบบจะปิดงานที่เกี่ยวข้องและคืน Worker ไปงานถัดไป
      operationId: handleLineWebhook
      parameters:
        - in: header
          name: x-line-signature
          schema:
            type: string
          required: false
          description: Required when LINE_CHANNEL_SECRET is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineWebhookRequest"
      responses:
        "200":
          description: LINE webhook processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineWebhookResponse"
