paths:
  /api/line/webhook:
    post:
      tags:
        - LINE
      summary: รับ webhook จาก LINE ของ Vendor
      description: รับ postback จากปุ่ม confirm, reject และ rating ใน LINE Flex message แล้วอัปเดตสถานะ ticket ตาม token ที่แนบมา ถ้างานครบทุก ticket ระบบจะปิดงานที่เกี่ยวข้องและคืน Worker ไปงานถัดไป
      operationId: handleLineWebhook
      parameters:
        - in: header
          name: x-line-signature
          schema:
            type: string
          required: false
          description: Required when LINE_CHANNEL_SECRET is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineWebhookRequest"
      responses:
        "200":
          description: LINE webhook processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineWebhookResponse"
