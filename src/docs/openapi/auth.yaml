paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Log in and create a user session.
      description: |
        Worker Mobile should send DeviceId and DeviceName on login. If Firebase SDK already has an FCM token, send FcmToken and Platform in this request so the backend can store the push token immediately.
        If the mobile app does not have an FCM token yet, login can continue without it; call POST /api/auth/push-token later after Firebase SDK returns the token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another active session exists on a different device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginConflictResponse"
        "423":
          description: Account is inactive or locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/login/confirm-force:
    post:
      tags:
        - Auth
      summary: Confirm forced login and replace the old active session.
      description: |
        Use after login returns ACTIVE_SESSION_EXISTS. If Firebase SDK already has the latest FCM token for the new device session, send FcmToken and Platform here.
        If the token is not available yet, call POST /api/auth/push-token after this request succeeds.
      operationId: confirmForceLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmForceLoginRequest"
      responses:
        "200":
          description: Force login confirmed and new session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          description: Invalid request body or challenge data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login challenge is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: Account is inactive or locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate a refresh token and issue new tokens.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refresh successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSuccessResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Refresh token is invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the current authenticated session.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccessResponse"
        "401":
          description: Access token is invalid, expired, or session was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/push-token:
    post:
      tags:
        - Auth
      summary: Register or refresh the current worker device FCM token.
      description: |
        Worker Mobile can call this after login when FcmToken was not available during Auth login, or whenever Firebase SDK returns a refreshed FCM token.
        This endpoint does not request a token from Firebase. Mobile must obtain the FCM token from Firebase SDK first, then send it to the backend.
        The backend stores the token by WorkerCode + DeviceId + Platform and uses it for worker push notifications.
        The raw FCM token is never returned in the response.
      operationId: registerAuthPushToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerPushTokenRequest"
      responses:
        "200":
          description: Worker push token registered successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerPushTokenResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Access token is invalid, expired, or session was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only worker accounts can register worker push tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get the current authenticated account and session context.
      operationId: getCurrentAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedAccount"
        "401":
          description: Access token is invalid, expired, or session was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me/password:
    patch:
      tags:
        - Auth
      summary: Change the current account password.
      operationId: changeOwnPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOwnPasswordRequest"
      responses:
        "200":
          description: Password changed. The current session stays active and other active sessions are revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOwnPasswordResponse"
        "400":
          description: Invalid request body or current password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Access token is invalid, expired, or session was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me/lang:
    patch:
      tags:
        - Auth
      summary: Update the current account language preference.
      operationId: updateOwnLang
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountLangRequest"
      responses:
        "200":
          description: Language preference updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAccountLangResponse"
        "400":
          description: Invalid language payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Access token is invalid, expired, or session was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
