paths:
  /ws/workers:
    get:
      tags:
        - Worker Application
      summary: "[WebSocket] Connect Worker Mobile for realtime assignment dispatch."
      description: |
        WebSocket endpoint for Worker Mobile only.

        Connect with one of these token formats:
        - `ws://localhost:8080/ws/workers?token=<AccessToken>`
        - `Authorization: Bearer <AccessToken>` during the upgrade request
        - `Sec-WebSocket-Protocol: token.<AccessToken>`

        Backend sends realtime events such as `WORKER_ASSIGNED`, `ASSIGNMENT_TIMEOUT`,
        `ASSIGNMENT_CANCELLED`, `ASSIGNMENT_ACCEPTED`, `ASSIGNMENT_TEAM_UPDATED`,
        `WORKER_STATUS_CHANGED`, `TICKET_COMPLETION_SUBMITTED`, `TICKET_COMPLETION_RESULT`,
        `ASSIGNMENT_SCAN_DEADLINE_EXTENDED`,
        `ASSIGNMENT_SCAN_DEADLINE_SHORTENED`,
        `STALL_JOB_CANCELLED`, `MARKET_JOB_CANCELLED`, `VEHICLE_JOB_CANCELLED`, and
        `SESSION_REVOKED`.
        Events that are intended for mobile display include a localized `Notification`
        object with `Key`, `Lang`, `Title`, and `Message`.
        `WORKER_ASSIGNED` sends `TicketNumber` and
        `Assignment.CreatedAt/AcceptDeadlineAt/AcceptDeadlineUnixMs` only — no per-Business-Ticket
        detail, since a vehicle's Business Tickets can arrive after the worker is already
        assigned. Call `GET /api/workers/me/status` (or the accept response) to read
        `Markets[].TicketNo`, the value scanned via `POST .../check-in-barcode`.
        `ASSIGNMENT_TEAM_UPDATED` is sent to every worker assigned to the same vehicle job after accept/check-in and includes the latest `TicketNumber`, `WorkerStatus`, `TeamScan`, and `Team` snapshot.
        It does not send `DriverQrToken`.
        Important worker notification events are also sent through FCM when the worker has an active registered FCM token.
        Worker actions such as accept/check-in/complete still use the REST endpoints.
      operationId: connectWorkerWebSocket
      security:
        - bearerAuth: []
      responses:
        "101":
          description: WebSocket connection upgraded successfully.
        "401":
          description: Missing or invalid access token/session.
        "404":
          description: WebSocket path not found.
  /api/workers/me/online:
    post:
      tags:
        - Worker Application
      summary: Put the current worker into Redis FIFO queue during the assigned shift time.
      description: |
        Worker Mobile must have an active `/ws/workers` WebSocket connection before going online.
        From open_app, a worker can enter the queue only once per configured shift/day.
        If the worker returns early from break, this endpoint can put the worker back into queue before the break timer ends.
        After `/api/workers/me/offline` or a shift-end auto close, the worker cannot go online again until the next shift.
      operationId: workerOnline
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Worker enters queue successfully. Response Code is WORKER_ONLINE_SUCCESS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOnlineResponse"
        "403":
          description: Worker is inactive, has no current schedule, or is outside the assigned shift time. OUTSIDE_WORK_SHIFT includes shift and remaining time details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Worker WebSocket is not connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/workers/me/offline:
    post:
      tags:
        - Worker Application
      summary: Remove the current worker from Redis FIFO queue.
      description: Marks the current shift as closed for this worker. The worker cannot re-enter the queue in the same shift after this call.
      operationId: workerOffline
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Worker leaves dispatch queue successfully. Response Code is WORKER_OFFLINE_SUCCESS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOnlineResponse"
  /api/workers/me/break:
    post:
      tags:
        - Worker Application
      summary: Put the current worker on a configured break during the assigned shift time.
      description: Break duration and daily/shift break limit come from runtime settings. Default is 4 breaks, 15 minutes each.
      operationId: workerBreak
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Worker break summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerBreakResponse"
        "403":
          description: Worker is inactive, has no current schedule, or is outside the assigned shift time. OUTSIDE_WORK_SHIFT includes shift and remaining time details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Worker is not ready, already assigned/working, or reached the break limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/workers/me/status:
    get:
      tags:
        - Worker Application
      summary: Get current worker profile, shift, status, and daily summary.
      description: >
        Safe to call any time, including right after the app is closed and reopened, since
        current_job is always re-derived live from persisted assignment state (not from a
        one-time push payload). While status is "assigned", current_job.accept_deadline_at /
        accept_deadline_unix_ms are set if the assignment is still PENDING (worker has not
        pressed accept yet), or current_job.scan_deadline_at / scan_deadline_unix_ms are set
        once ACCEPTED (worker is waiting to scan check-in) — never both at once. Once the
        worker scans, status becomes waiting_team (teammates still scanning) or working (team
        ready), and both deadline pairs return null.
      operationId: getWorkerStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Worker profile, current shift, current status, and daily counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerStatusResponse"
  /api/workers/me/assignments/history:
    get:
      tags:
        - Worker Application
      summary: Get the current worker assignment history by date or date range.
      description: >
        Returns assignment history for the authenticated worker only.

        Use date for a single Bangkok calendar day, or date_from and date_to
        for an inclusive Bangkok calendar date range. If date/date_from/date_to
        are omitted, the API uses today's Asia/Bangkok date. date cannot be
        combined with date_from/date_to. date_from and date_to must be sent
        together, date_from must be less than or equal to date_to, and the
        inclusive range must not exceed 31 calendar days. The database filter
        uses VehicleJobAssignment.createdAt with [startAt, dayAfterEndAt).
      operationId: getWorkerAssignmentHistory
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
            example: "2026-08-14"
          description: Single assignment-created date in YYYY-MM-DD format, interpreted in Asia/Bangkok time. Defaults to today's Bangkok date when date/date_from/date_to are omitted.
        - in: query
          name: date_from
          required: false
          schema:
            type: string
            format: date
            example: "2026-08-01"
          description: Inclusive start date for date range. Must be used together with date_to.
        - in: query
          name: date_to
          required: false
          schema:
            type: string
            format: date
            example: "2026-08-14"
          description: Inclusive end date for date range. Must be used together with date_from.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
          description: Optional page number. If page or limit is sent, the response includes pagination metadata.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
          description: Optional page size. Defaults to 20 when page or limit is sent.
      responses:
        "200":
          description: Worker assignment history for the selected date or date range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerAssignmentHistoryResponse"
        "400":
          description: Invalid or missing date/date range query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/workers/me/earnings/summary:
    get:
      tags:
        - Worker Application
      summary: Get the current worker persisted earnings summary for the latest 15 completed Bangkok calendar days.
      description: No query parameters are accepted. The current Bangkok calendar day is excluded. Details.Earnings is read directly from persisted TicketWorker.finalEarningAmount.
      operationId: getWorkerEarningsSummary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Worker earnings summary for the latest 15 completed calendar days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerEarningsSummaryResponse"
        "400":
          description: Query parameters are not supported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/workers/me/notifications:
    get:
      tags:
        - Worker Application
      summary: List current worker notification history.
      description: Returns persisted worker notification payload history for mobile app inbox display. This endpoint is read-only.
      operationId: listWorkerNotifications
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        "200":
          description: Worker notification history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerNotificationListResponse"
        "401":
          description: Worker token is invalid, expired, or session was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/workers/me/assignments/{ticketNumber}/accept:
    post:
      tags:
        - Worker Application
      summary: Accept a pending worker assignment within the configured accept deadline.
      description: If the worker misses the accept deadline, the assignment becomes TIMEOUT and the worker is moved to the queue tail even when the Worker WebSocket is disconnected. The accept-timeout streak resets after a successful accept. After worker_accept_timeout_limit consecutive accept timeouts, the worker is moved to open_app and cannot re-enter the queue in the same shift. A successful response includes accepted_at, worker_code, shirt_number, scan_deadline_at, and scan_deadline_unix_ms from the persisted assignment so the frontend can calculate the scan countdown locally.
      operationId: acceptWorkerAssignment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNumber
          description: ticketNumber from the WORKER_ASSIGNED push/socket payload.
          required: true
          schema:
            type: string
            example: TRUCK-20260804-001
      responses:
        "200":
          description: Accepted assignment and job detail for the worker job screen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerAssignmentAcceptResponse"
  /api/workers/me/assignments/{ticketNumber}/check-in-barcode:
    post:
      tags:
        - Worker Application
      summary: Check in to an accepted assignment by scanning a Business Ticket's barcode.
      description: |
        Requires ticket_no in the request body — the Business Ticket number printed as a
        barcode on the physical paper ticket Gate hands the worker (the same value also
        available at markets[].ticket_no in the accept response, or
        current_job.markets[].ticket_no from GET /api/workers/me/status). It is a real
        business identifier, not an opaque secret, but is resolved safely by scoping the
        lookup to this worker's own vehicle (from the ticketNumber path param + auth) rather
        than trusting a system-wide match. Scanning any one Business Ticket under the vehicle
        checks in the whole team, since dispatch is vehicle-scoped.
        Worker can check in only while scan_deadline_at is valid. Countdown-capable responses and events include scan_deadline_unix_ms in Unix milliseconds.
        After this worker checks in, worker_status is waiting_team until every active/eligible team assignment has scanned, then working.
        For multi-worker vehicle jobs, the first successful check-in shortens remaining ACCEPTED workers to the configured worker_scan_team_remaining_minutes window and emits ASSIGNMENT_SCAN_DEADLINE_SHORTENED.
        Backend emits ASSIGNMENT_SCAN_DEADLINE_WARNING to Admin SSE when an ACCEPTED worker has not checked in and remaining scan time is below worker_scan_warning_before_minutes.
        If the scan window expires by API call or background timeout, the assignment becomes TIMEOUT and the worker returns to open_app.
      operationId: checkInWorkerAssignmentBarcode
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNumber
          description: TicketNumber (vehicle-level job reference) of the worker's current assignment.
          required: true
          schema:
            type: string
            example: TRUCK-20260804-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCheckInBarcodeRequest"
      responses:
        "200":
          description: Checked-in assignment status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerAssignmentCheckInResponse"
        "404":
          description: Assignment not found, or ticket_no does not match any Business Ticket under this worker's vehicle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Assignment is not accepted or scan window expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/workers/me/products/{productCode}/packages:
    get:
      tags:
        - Worker Application
      summary: List active PackageCode options for one ProductCode, for switching a product's package on submit.
      description: |
        Use when a worker counts the produce at a booth and finds it is actually a different
        package size than what Gate originally declared for that product line (not just a
        different quantity). productCode must be one already present on the ticket being
        edited (from current_job.markets[]... product lines or the earlier accept/status
        response) — this endpoint only looks up alternate packages of that same product, it
        does not let a worker switch to a different product entirely.
        Response Packages[].PackageCode is the value to send back as the new packageCode in
        POST .../tickets/complete; PackageName is for UI display only.
      operationId: getWorkerProductPackageOptions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productCode
          required: true
          schema:
            type: string
            example: "02020300"
          description: ProductCode of the product line being edited, from the ticket's existing products.
      responses:
        "200":
          description: Active package options for this ProductCode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerProductPackageOptionsResponse"
        "404":
          description: No active product matches this ProductCode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/workers/me/assignments/{ticketNumber}/tickets/complete:
    post:
      tags:
        - Worker Application
      summary: Submit counted product quantities for a GateTicket using ticket_no and BoothCode in body.
      description: |
        Preferred endpoint for mobile clients. Send boothCode in the JSON body so BoothCode values containing "/" such as OM3/40 do not need URL encoding.
        ticket_no (required) names which Business Ticket this submission belongs to — needed
        because two Business Tickets under the same vehicle, against different markets, can
        legitimately share the same BoothCode; ticket_no plus boothCode together resolve the
        exact booth unambiguously.
        After worker submits quantities, the ticket and assignment status become DELIVERED.
        Workers can submit any stall/market in the same vehicle job once the assigned team has checked in; the API no longer requires waiting for the previous stall to close first.
        To switch a product's package (not just its quantity), first call
        GET /api/workers/me/products/{ProductCode}/packages to find a valid new PackageCode,
        then send that item with packageCode set to the new value and original_package_code
        set to the PackageCode Gate originally declared for that product line. The backend
        looks up a fresh rate snapshot for the new package (weight/rate can differ by
        package) before accepting the submission; a PackageCode with no active master data
        for that ProductCode is rejected with 409 PRODUCT_PACKAGE_NOT_FOUND. Items that are
        not switching a package only need packageCode (existing behavior, unchanged).
        Vendor receives a LINE Flex card with Confirm/Reject buttons, showing both the
        originally declared package and the new one when a product's package was switched.
        If vendor confirms through LINE, the ticket closes and backend sends an optional 1-5 satisfaction rating Flex prompt to the confirming LINE user. If vendor rejects, the assignment status becomes REJECT and the same endpoint can be used to resubmit.
        If vendor does not respond, the timeout is controlled by vendor_confirm_timeout_hours for the first submission and vendor_reconfirm_timeout_hours after a rejected resubmission.
      operationId: completeWorkerAssignmentTicketWithBodyBoothCode
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNumber
          required: true
          schema:
            type: string
            example: TRUCK-20260804-001
          description: TicketNumber (vehicle-level job reference) of the worker's current assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerTicketCompleteWithBoothRequest"
      responses:
        "200":
          description: Ticket completion submitted and waiting for vendor confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCompletionResponse"
        "403":
          description: Worker is not assigned to this ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ticket is already waiting for vendor confirmation, closed, or not ready for completion; or, when switching a product's package, the new PackageCode has no active/unambiguous master data or no rate is configured for it (PRODUCT_PACKAGE_NOT_FOUND, AMBIGUOUS_PRODUCT_PACKAGE, RATE_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
