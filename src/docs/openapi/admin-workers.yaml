paths:
  /api/admin/users:
    post:
      tags:
        - Admin Workers
      summary: สร้างบัญชี Worker
      description: Admin สร้าง account, profile, ตารางกะเริ่มต้น และรูปโปรไฟล์ของ Worker ใหม่
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateUserMultipartRequest"
      responses:
        "201":
          description: Worker account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionMessageResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated account is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username or shirt number already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Admin Workers
      summary: ดูรายการบัญชี Worker
      description: คืนรายการ Worker แบบแบ่งหน้า พร้อมค้นหาจากรหัสหรือชื่อ และกรองสถานะ active/inactive ได้
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of records per page.
        - in: query
          name: search
          schema:
            type: string
          description: Search by worker code or name.
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - inactive
          description: Filter by account status.
      responses:
        "200":
          description: Paginated worker list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated account is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/users/{workerCode}:
    get:
      tags:
        - Admin Workers
      summary: ดูรายละเอียด Worker หนึ่งคน
      description: ดึงข้อมูล account, profile และตารางกะล่าสุดของ Worker ตาม WorkerCode
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: workerCode
          required: true
          schema:
            type: string
          description: WorkerCode, for example MN000115.
      responses:
        "200":
          description: Worker account details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated account is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Worker account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Admin Workers
      summary: แก้ไขข้อมูล Worker
      description: Admin แก้ข้อมูล account, profile, สถานะ และตารางกะปัจจุบันของ Worker ตาม WorkerCode
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: workerCode
          required: true
          schema:
            type: string
          description: WorkerCode, for example MN000115.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Worker account updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
        "400":
          description: Invalid request body or shift time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated account is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Worker account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Worker code already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/users/{workerCode}/password:
    patch:
      tags:
        - Admin Workers
      summary: รีเซ็ตรหัสผ่าน Worker
      description: ตั้งรหัสผ่านใหม่ให้ Worker และยกเลิก session ที่ยังใช้งานอยู่ทั้งหมดของ Worker คนนั้น
      operationId: resetUserPassword
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: workerCode
          required: true
          schema:
            type: string
          description: WorkerCode, for example MN000115.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionMessageResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated account is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Worker account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
