paths:
  /api/admin/jobs/workers/status:
    get:
      tags:
        - Admin Jobs
      summary: List current-shift workers on the admin board sorted by real queue/status order.
      operationId: listAdminJobWorkerStatuses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current-shift worker status list for admin job operations. Workers with an active queue/assignment remain visible even when their WebSocket is disconnected; use SocketConnected to show connection state. Data is sorted by status column and status_entered_at, with ready workers ordered by Redis queue_position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWorkerStatusListResponse"
        "403":
          description: Authenticated account lacks jobs:read permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/jobs/workers/{workerCode}/status/force:
    post:
      tags:
        - Admin Jobs
      summary: Force a worker status when admin must correct status during job operations.
      operationId: forceAdminJobWorkerStatus
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: workerCode
          required: true
          schema:
            type: string
          description: WorkerCode, for example MN000115.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminForceWorkerStatusRequest"
      responses:
        "200":
          description: Worker status forced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminForceWorkerStatusResponse"
        "403":
          description: >
            Worker is inactive, missing a schedule for forced break, outside their work shift
            (WORKER_OUTSIDE_WORK_SHIFT — Admin must correct the worker's shift time first, for
            any target status), or actor lacks workers:force_status permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Worker is not online, has an active assignment, or break limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/operations:
    get:
      tags:
        - Admin Jobs
      summary: List vehicle jobs for the Admin vehicle operation board.
      operationId: listAdminVehicleJobOperations
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
            example: "2026-07-07"
          description: Optional legacy single-day filter in YYYY-MM-DD format. Equivalent to sending date_from and date_to as the same date.
        - in: query
          name: date_from
          schema:
            type: string
            format: date
            example: "2026-07-01"
          description: Optional created date range start in YYYY-MM-DD format, interpreted in Asia/Bangkok.
        - in: query
          name: date_to
          schema:
            type: string
            format: date
            example: "2026-07-07"
          description: Optional created date range end in YYYY-MM-DD format, inclusive and interpreted in Asia/Bangkok.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            example: 1
          description: Optional. If sent, the API returns only that page and includes pagination metadata after operation_status filtering.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
          description: Optional page size. Used only when page is sent. Defaults to 20.
        - in: query
          name: search
          schema:
            type: string
          description: Search by ticketNo, license plate, gate transaction ref, marketCode/marketName, boothCode/boothName, productCode/productName/packageCode/packageName.
        - in: query
          name: operation_status
          schema:
            type: string
            enum:
              - unload_now
              - waiting_unload
              - waiting_queue
              - driver_waiting_queue
          description: Filter by vehicle dispatch/worker-call status only. Work progress is represented by vehicle_job.status, workers[].assignment_status, and ticket status fields.
      responses:
        "200":
          description: Vehicle operation board list with summary, workers, markets, stall jobs, and products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleJobOperationListResponse"
  /api/admin/vehicle-jobs/history:
    get:
      tags:
        - Admin Jobs
      summary: List vehicle job history for admin operations.
      operationId: listAdminVehicleJobHistory
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
            example: "2026-07-07"
          description: Optional legacy single-day filter in YYYY-MM-DD format. Equivalent to sending date_from and date_to as the same date.
        - in: query
          name: date_from
          schema:
            type: string
            format: date
            example: "2026-07-01"
          description: Optional created date range start in YYYY-MM-DD format, interpreted in Asia/Bangkok.
        - in: query
          name: date_to
          schema:
            type: string
            format: date
            example: "2026-07-07"
          description: Optional created date range end in YYYY-MM-DD format, inclusive and interpreted in Asia/Bangkok.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            example: 1
          description: Optional. If sent, the API returns only that page and includes pagination metadata. If omitted, all matching rows are returned.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
          description: Optional page size. Used only when page is sent. Defaults to 20.
        - in: query
          name: search
          schema:
            type: string
          description: Search by ticketNo, license plate, gate transaction ref, marketCode/marketName, boothCode/boothName, productCode/productName/packageCode/packageName.
        - in: query
          name: status
          schema:
            type: string
            enum:
              - WAIT
              - WORKING
              - DELIVERED
              - REJECT
              - COMPLETED
              - CANCELLED
              - PENDING
              - ACCEPTED
              - SCANNED
              - TIMEOUT
          description: Filter by status at vehicle, market, stall, stall confirmation, or worker assignment level.
      responses:
        "200":
          description: >
            Vehicle job history list with markets, stall jobs, and products. Each item also
            includes workers (every worker ever dispatched to the vehicle job, with derived
            accept/scan/submit/release timestamps), timeline (a chronological merge of worker
            lifecycle events, booth submission/reject/confirm events, and admin actions), finance
            (job-level totals reused from the same persisted financial records as
            /financials), and derived job-level timestamps (work_start, submitted_complete_at,
            vendor_confirmed_complete_at, completed_at, duration_seconds). Nothing here is
            recalculated from a formula; everything is read from existing persisted data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleJobListResponse"
  /api/admin/vehicle-jobs/history/daily-worker-income:
    get:
      tags:
        - Admin Jobs
      summary: List each worker's per-Business-Ticket earnings (one row per worker per Business Ticket).
      description: >
        Nested under the existing /vehicle-jobs/history namespace rather than a new
        /work-history root, since this report is derived from the same Vehicle Job History data.
        payable is TicketWorker.final_earning_amount taken as-is once financialized; it is never
        recomputed. Accepts both this endpoint's own query names and aliases matching the
        /vehicle-jobs/history convention (from/to are aliases of date_from/date_to, workerCode
        is an alias of worker_code, keyword is an alias of search, pageSize is an alias of
        limit) so existing Frontend query-building code for History can be reused as-is.
      operationId: listAdminDailyWorkerIncome
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date_from
          schema:
            type: string
            format: date
            example: "2026-07-01"
          description: Created date range start in YYYY-MM-DD, interpreted in Asia/Bangkok.
        - in: query
          name: date_to
          schema:
            type: string
            format: date
            example: "2026-07-07"
          description: Created date range end in YYYY-MM-DD, inclusive, interpreted in Asia/Bangkok.
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: Alias of date_from.
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: Alias of date_to.
        - in: query
          name: worker_code
          schema:
            type: string
          description: Filter to one worker's rows.
        - in: query
          name: workerCode
          schema:
            type: string
          description: Alias of worker_code.
        - in: query
          name: status
          schema:
            type: string
          description: Filter by TicketWorker status.
        - in: query
          name: shift
          schema:
            type: integer
            minimum: 1
          description: Filter by the worker's shift number.
        - in: query
          name: search
          schema:
            type: string
          description: Search by ticketNo, license plate, marketCode/marketName, or worker code/name.
        - in: query
          name: keyword
          schema:
            type: string
          description: Alias of search.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Alias of limit.
      responses:
        "200":
          description: One row per worker per Business Ticket, with the locked payout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDailyWorkerIncomeListResponse"
        "403":
          description: Authenticated admin lacks jobs:read permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/{ticketNo}/financials:
    get:
      tags:
        - Admin Jobs
      summary: Get persisted financial breakdown of a vehicle job.
      description: >
        Returns the persisted financial result of a VehicleJob grouped by
        booth, product, and worker. This endpoint is read-only and does not
        recalculate money from the current MasterRate. Product financial values
        come from TicketProductFinancial and worker earnings come from
        TicketWorkerPayment.finalAmount. financial_status is PENDING when no
        booth is financialized, PARTIAL when only some booths are financialized,
        and FINALIZED when every booth is financialized. RateSnapshot shows the
        values captured when the Gate ticket was created. Quantity is the original
        Gate operational quantity; ConfirmedQuantity is the worker-confirmed
        quantity used for financial calculation after vendor confirmation.
      operationId: getAdminVehicleJobFinancials
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNo
          required: true
          schema:
            type: string
            example: TKT-20260723-000125
          description: Vehicle TicketNo.
      responses:
        "200":
          description: Persisted financial breakdown of the vehicle job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleJobFinancialResponse"
        "403":
          description: Authenticated admin lacks jobs:read permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle job was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/jobs/cancel:
    post:
      tags:
        - Admin Jobs
      summary: Cancel a vehicle, market, or stall job using one endpoint.
      operationId: cancelAdminJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminJobCancelRequest"
      responses:
        "200":
          description: Job cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobCancelResponse"
  /api/admin/vehicle-jobs/{ticketNo}/assign-workers:
    post:
      tags:
        - Admin Jobs
      summary: Manually assign a vehicle job to selected workers who are ready in queue.
      operationId: assignAdminVehicleJobWorkers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNo
          required: true
          schema:
            type: string
            example: TKT-20260723-000125
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAssignWorkersRequest"
      responses:
        "201":
          description: Workers assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAssignWorkersResponse"
        "403":
          description: >
            A listed worker is outside their work shift (WORKER_OUTSIDE_WORK_SHIFT) — this is
            checked even if the worker's queue status shows ready, because ready alone does not
            guarantee the worker is currently inside their shift window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/{ticketNo}/scan-deadline/extend:
    post:
      tags:
        - Admin Jobs
      summary: Extend scan deadline for accepted workers whose scan deadline has not expired.
      operationId: extendAdminVehicleJobScanDeadline
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNo
          required: true
          schema:
            type: string
            example: TKT-20260723-000125
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminExtendScanDeadlineRequest"
      responses:
        "200":
          description: Scan deadline extended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExtendScanDeadlineResponse"
  /api/admin/vehicle-jobs/{ticketNo}/workers/{workerCode}/assignment/cancel:
    post:
      tags:
        - Admin Jobs
      summary: Cancel one worker assignment without auto-refilling from queue.
      operationId: cancelAdminAssignment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNo
          required: true
          schema:
            type: string
            example: TKT-20260723-000125
        - in: path
          name: workerCode
          required: true
          schema:
            type: string
            example: MN000115
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCancelRequest"
      responses:
        "200":
          description: Assignment cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCancelAssignmentResponse"
  /api/admin/vehicle-jobs/{ticketNumber}/stalls/{stallCode}/override-count:
    post:
      tags:
        - Admin Jobs
      summary: Admin submits or corrects a booth's product quantities on behalf of a worker.
      description: >
        Looks up products by productCode+packageCode (the same business key used by the
        worker-facing submit-count flow), not by internal id. Rejected once the booth is already
        closed (COMPLETED/CANCELLED) or already financialized, since money would otherwise be
        silently invalidated after being locked. Every call is recorded in AdminActionLog with
        the given reason, and appears in Work History's Timeline as an ADMIN_ACTION event.
      operationId: overrideAdminTicketProductCounts
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNumber
          required: true
          schema:
            type: string
            example: TRUCK-20260723-001
        - in: path
          name: stallCode
          required: true
          schema:
            type: string
            example: OM3/40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOverrideCountRequest"
      responses:
        "200":
          description: Booth counts overridden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverrideCountResponse"
        "403":
          description: Authenticated admin lacks jobs:override_count permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle job, booth, or product was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Booth is already closed or already financialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/{ticketNumber}/wait:
    post:
      tags:
        - Admin Jobs
      summary: Admin sets a vehicle job back to WAIT status.
      description: >
        Only allowed while every booth under the vehicle job is still WAIT (no booth has started
        work yet), so no in-progress worker assignment, queue, or timeout state needs to be
        unwound. Does not touch VehicleJobAssignment; the dispatched team is treated as still
        waiting at the site, not removed from the job. Recorded in AdminActionLog and appears in
        Work History's Timeline as an ADMIN_ACTION event.
      operationId: setAdminVehicleJobToWait
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNumber
          required: true
          schema:
            type: string
            example: TRUCK-20260723-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVehicleWaitRequest"
      responses:
        "200":
          description: Vehicle job set back to WAIT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleWaitResponse"
        "403":
          description: Authenticated admin lacks jobs:wait permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle job was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Vehicle job is already closed, or already has a booth in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/{ticketNumber}/release-workers:
    post:
      tags:
        - Admin Jobs
      summary: Admin releases the dispatched worker team back to the FIFO queue once every booth has been submitted.
      description: >
        Usable once every booth on the vehicle job has been submitted by the worker — status
        DELIVERED (submitted, awaiting vendor confirmation), COMPLETED (vendor confirmed), or
        CANCELLED. Does NOT require vendor confirmation first: the worker's physical duty ends
        the moment they submit counted quantities, so the team can be released while a booth is
        still DELIVERED and waiting on the vendor. A booth still WAIT/WORKING (not yet
        submitted) or REJECT (an unresolved vendor rejection the worker must fix and resubmit)
        blocks release with BOOTHS_NOT_SUBMITTED. Also does not require the whole vehicle job to
        close, Gate to signal no more Business Tickets, or per-Business-Ticket financial
        finalize — money is settled later independently, and releasing workers does not change
        the booth/vehicle job's own status (it stays DELIVERED/WORKING in Work History until the
        vendor actually confirms or times out). Recorded in AdminActionLog and appears in Work
        History's Timeline both as an ADMIN_ACTION event and as a WORKER_RELEASED event per
        worker.
      operationId: releaseAdminVehicleJobWorkers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNumber
          required: true
          schema:
            type: string
            example: TRUCK-20260723-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReleaseWorkersRequest"
      responses:
        "200":
          description: Workers released back to the FIFO queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReleaseWorkersResponse"
        "403":
          description: Authenticated admin lacks jobs:release_workers permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle job was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Vehicle job is already closed (VEHICLE_JOB_CLOSED), has no booths yet (NO_SUBMITTED_BOOTHS), has a booth still WAIT/WORKING/REJECT (BOOTHS_NOT_SUBMITTED), or has no releasable workers (NO_RELEASABLE_WORKERS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
