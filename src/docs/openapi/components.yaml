        correction_owner_type:
          type: string
          enum:
            - worker
            - admin
          description: Who should be the one to correct this rejection, evaluated against the vehicle job's current status (not a historical snapshot at the time of this rejection, same as correction_owner) — "worker" while the vehicle job has not been released (the team is still on-site and can resubmit themselves), "admin" once the vehicle job has been released (the team is back in the queue, so an admin must handle it).
        rejected_by_type:
          type: string
          nullable: true
          enum:
            - owner
            - member
          description: Resolved from TicketCompletionSubmission.resolved_by_line_user_id against MasterOwnerStall then MasterMemberStall. Null when the reject was an auto-confirm timeout (no LINE user) or could not be resolved.
        rejected_by_name:
          type: string
          nullable: true

    AdminHistoryProduct:
      description: Same fields as AdminFinancialProduct except ticket_product_id (an internal PK the /financials override screen needs but Work History, which is read-only, does not).
      type: object
      properties:
        productCode:
          type: string
