    AdminPermission:
      type: string
      description: >-
        mobile_app_versions:create and mobile_app_versions:update each require
        mobile_app_versions:read to also be present in the same permission set
        (PERMISSION_DEPENDENCY_NOT_SATISFIED otherwise). The whole
        mobile_app_versions:* group can only be granted or revoked by an
        owner-level admin, even by an actor who already holds
        permissions:update (OWNER_ONLY_PERMISSIONS otherwise) — this only
        blocks requests that actually change that group; resubmitting a
        target's existing mobile_app_versions:* set unchanged is allowed.
      enum:
        - settings:read
        - settings:update
        - roles:read
        - admins:create
        - admins:update
        - admins:reset_password
        - gate_clients:read
        - gate_clients:create
        - gate_clients:update
        - gate_clients:rotate_secret
        - permissions:read
        - permissions:update
        - workers:read
        - workers:create
        - workers:update
        - workers:reset_password
        - workers:force_status
        - jobs:read
        - jobs:assign
        - jobs:cancel
        - jobs:extend_deadline
        - jobs:override_count
        - jobs:wait
        - jobs:release_workers
        - mobile_app_versions:read
        - mobile_app_versions:create
        - mobile_app_versions:update
