      type: object
      required:
        - ticket_number
        - reason_code
      description: >-
        Unified cancel request — scope is decided by which of ticket_no/boothCode/worker_code are
        given (see AdminVehicleJobAssignmentCancelResponse for the full mapping table). Every
        field except ticket_number and reason_code may be omitted or sent as null to mean "not
        specified".
      properties:
        ticket_number:
          type: string
          example: TRUCK-20260723-001
        ticket_no:
          type: string
          nullable: true
          example: TKT-20260723-000125
        boothCode:
          type: string
          nullable: true
          example: OM3/40
        worker_code:
          type: string
          nullable: true
          example: MN000115
        reason_code:
          type: string
          description: Required, never null — recorded to admin_action_logs as a string for every scope.
          example: DUPLICATE_TICKET
        reason_text:
          type: string
          nullable: true
          example: Gate created this ticket twice.
    AdminVehicleJobAssignmentCancelResponse:
      description: >-
        Shape depends on which scope was resolved from the request:
        ticket_number alone -> AdminCancelVehicleJobRequeueResponse (whole vehicle job);
        + ticket_no -> AdminCancelMarketJobResponse (one Business Ticket);
        + ticket_no + boothCode -> AdminCancelStallJobResponse (one Booth);
        + worker_code alone -> AdminCancelAssignmentResponse (one worker's assignment, whole
        vehicle job); + ticket_no + worker_code -> AdminCancelTicketWorkerResponse (one worker
        removed from one Business Ticket only); + ticket_no + boothCode + worker_code ->
        AdminCancelTicketWorkerFromBoothResponse (one worker removed from just one Booth's payout
        divisor, TicketWorker.status untouched).
      oneOf:
        - $ref: "#/components/schemas/AdminCancelVehicleJobRequeueResponse"
        - $ref: "#/components/schemas/AdminCancelMarketJobResponse"
        - $ref: "#/components/schemas/AdminCancelStallJobResponse"
        - $ref: "#/components/schemas/AdminCancelAssignmentResponse"
        - $ref: "#/components/schemas/AdminCancelTicketWorkerFromBoothResponse"
        - $ref: "#/components/schemas/AdminCancelTicketWorkerResponse"
    AdminVehicleOperationStatus:
      type: string
      description: >-
        Mutually exclusive — every vehicle job falls into exactly one, decided in this
        priority order (highest first): cancelled, completed, reject (any booth
        currently REJECT, unresolved), wait_unload (dispatchNow=false, whether set by
        Gate at creation or toggled off later by Admin), wait_worker (dispatchNow=true
        but active workers < workers_required — FIFO auto-dispatch still filling the
        team), ready_now (team full and dispatchNow=true, but work_started_at is still
        null — nobody has scanned in yet), working (work_started_at is set — the whole
        team has scanned in and is actively working; this also covers a vehicle job
        released early via release-workers — VehicleJob.status=RELEASED — since the
        work itself is not done yet, just waiting on Vendor confirmation/timeout; check
        vehicle_job.status directly if you need to distinguish a released job from one
        still being actively worked).
      enum:
        - cancelled
        - completed
        - reject
        - wait_unload
        - wait_worker
        - ready_now
        - working
      example: ready_now
    AdminVehicleJobOperationSummary:
      type: object
      properties:
        total:
          type: integer
          example: 8
        ready_now:
          type: integer
          example: 1
        wait_unload:
          type: integer
          example: 1
        wait_worker:
          type: integer
          example: 1
        working:
          type: integer
          example: 2
          description: >-
            Includes vehicle jobs released early via release-workers
            (VehicleJob.status=RELEASED) — see AdminVehicleOperationStatus.
        completed:
          type: integer
          example: 1
        cancelled:
          type: integer
          example: 0
        reject:
          type: integer
          example: 1
          description: Vehicle jobs with at least one currently-REJECT-status booth, unresolved.
