    AdminAuditEventItem:
      type: object
      description: >
        Unified audit event projected from existing transactional sources (VehicleJob,
        GateRequestLog, DriverSession, WorkerAssignmentEvent, TicketCompletionSubmission,
        TicketRating, MessageDeliveryLog, AdminActionLog, SecurityAuditLog — see 27.12). No
        central audit_events table exists — this is a merged read view.
      properties:
        event_id:
          type: string
          description: Stable id composed from source + primary key (+ sub-event suffix). Not a DB UUID.
          example: "admin_action:982"
        event_type:
          type: string
          example: scan_timer_extended
        actor_type:
          type: string
          enum:
            - system
            - admin
            - worker
            - driver
            - vendor
            - gate
          example: admin
        actor_id:
          type: string
          nullable: true
          description: Internal id of the actor (Account id for admin/worker, LINE user id for vendor). Null when the source has no actor identity (system/gate/driver).
          example: "15"
        vehicle_job_id:
          type: string
          nullable: true
          example: "120"
        market_job_id:
          type: string
          nullable: true
        ticket_id:
          type: string
          nullable: true
        assignment_id:
          type: string
          nullable: true
          example: "455"
        worker_id:
          type: string
          nullable: true
          description: Internal Account id of the worker involved, when the event concerns exactly one worker. Null for multi-worker events (see metadata for worker_account_ids/worker_codes instead).
        reason_code:
          type: string
          nullable: true
        reason_text:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Free-form context, including business codes for search/display — ticketNumber
            (VehicleJob), ticketNo/marketCode/marketName (MarketJob), boothCode/boothName
            (GateTicket, on completion submission and ticket rating events where actor_type may
            be vendor), workerCode (Account.username of the worker involved), and
            actorCode/actorName (Account.username/full_name of the admin actor, when actor_type
            is admin). Frontend uses these to build a human-readable business reference instead
            of showing raw internal ids — for a vendor actor, prefer boothName · boothCode over
            the LINE user id in actor_id. On SecurityAuditLog events (27.12, requires audit:read
            — see the endpoint description) additionally carries outcome (success/failure),
            sessionId, ipAddress, userAgent, failureCode
            (unknown_username/invalid_password/account_inactive, on auth_login_failed only),
            attemptedUsername (the raw username typed at login, only when the identity could not
            be resolved to any admin or worker account — never conflated with actorCode/workerCode
            of a resolved actor), and — on the account/settings/gate-client/mobile-version mutation
            events — targetType/targetAccountId/targetWorkerId/targetClientId/targetVersionId
            identifying what was changed. auth_session_revoked (27.14.1, written in the same
            transaction as auth_force_login) additionally carries revoke_source ("force_login")
            and new_session_id, referencing the session created by that same auth_force_login —
            trace the pair back to each other via the shared requestId instead. Never contains
            passwords, full tokens, session secrets, or gate client secrets/hashes.
          example:
            minutes: 15
            assignment_ids: [455]
            ticketNumber: "20261234567890"
            marketCode: "MKT-001"
            marketName: "ตลาดไท"
            boothName: "ร้านผักสด A"
            boothCode: "GV3/98"
            actorCode: "admin01"
            actorName: "สมชาย ใจดี"
        before:
          type: object
          additionalProperties: true
          description: >
            State of the changed field(s) immediately before this event, captured at the moment
            of the operation — never derived after the fact from current state or updated_at.
            Only present when the source actually recorded a prior value; omitted (not present,
            not null) for event types that don't track before/after, and omitted for this one
            occurrence when there was no prior value to record (e.g. the worker's very first
            forced status change, which has no earlier queue status, or a *_created event, which
            has nothing before it). Populated for worker_force_status_changed
            ({ "status": "..." }) and — only on the *_updated Security Audit mutation events, and
            only for the field(s) that actually changed — system_settings_updated,
            gate_client_updated, admin_account_updated, admin_permissions_changed,
            admin_status_changed, worker_account_updated, admin_profile_updated, and
            mobile_app_version_updated.
          example:
            status: ready
        after:
          type: object
          additionalProperties: true
          description: >
            State of the changed field(s) immediately after this event succeeded. Same presence
            rules as before, plus the *_created Security Audit mutation events
            (gate_client_created, admin_account_created, worker_account_created,
            mobile_app_version_created), which populate after with no matching before since
            nothing existed prior to the create.
          example:
            status: open_app
        occurred_at:
          type: string
          format: date-time
    AdminAuditEventsSummary:
      type: object
      properties:
        unique_vehicle_count:
          type: integer
