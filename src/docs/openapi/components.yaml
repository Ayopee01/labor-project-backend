    GateTicketProductRequest:
      type: object
      required:
        - ProductCode
        - PackageCode
        - Quantity
      properties:
        ProductCode:
          type: string
          example: "02020300"
          description: Product code used with PackageCode to lookup master_product.
        PackageCode:
          type: string
          example: "29"
          description: Package code used with ProductCode to lookup master_product.
        Quantity:
          type: integer
          minimum: 1
          example: 180

    GateTicketBoothRequest:
      type: object
      required:
        - BoothCode
        - Products
      properties:
        BoothCode:
          type: string
          example: OM3/40
          description: Booth code used with MarketCode to lookup master_market.
        Products:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GateTicketProductRequest"

    GateTicketRequest:
      type: object
      required:
        - TicketNumber
        - TicketNo
        - TicketCreatedAt
        - BoothCount
        - MarketCode
        - DropoffPoint
        - LicensePlate
        - LicensePlateProvince
        - VehicleTypeCode
        - VehicleTypeName
        - Booths
        - Dispatch
      properties:
        TicketNumber:
          type: string
          pattern: "^\\d{14}$"
          example: "20260804000001"
          description: >
            Vehicle-level job reference. Must be exactly 14 digits, numbers only — no letters or
            special characters. May be sent multiple times, each with a new TicketNo, as the same
            vehicle generates more Business Tickets over time (one Gate request per Business
            Ticket, all against exactly one market). An existing VehicleJob is reused; no
            duplicate vehicle job is created.

        TicketNo:
          type: string
          pattern: "^\\d{14}$"
          example: "20260804000002"
          description: >
            Business Ticket reference, scoped to one market. Must be exactly 14 digits, numbers
            only — no letters or special characters. One request = one market (all Booths in this
            request must belong to MarketCode) = BoothCount booths for this request. Sending the
            same TicketNo again under the same TicketNumber and the same MarketCode appends the
            new Booths/Products into that existing Business Ticket instead of creating a new one;
            the same TicketNo for a *different* MarketCode is always rejected with
            GATE_TICKET_ALREADY_EXISTS. If an Admin cancels a Ticket, its TicketNo becomes free
            again and can be reused here (for any MarketCode) to create a brand-new Business
            Ticket.

        TicketCreatedAt:
          type: string
          format: date-time
          example: "2026-08-04T14:30:00+07:00"

        BoothCount:
          type: integer
          minimum: 1
          example: 2
          description: Must equal the number of items in Booths. All Booths in this request share MarketCode.

        MarketCode:
          type: string
          example: "1123"

        DropoffPoint:
          type: string
          example: "Gate 1 - Zone A"
          description: >
            Where this Ticket's goods are unloaded. Required on every request, sent alongside
            MarketCode — different Tickets of the same MarketCode may send the same DropoffPoint
            again freely (no uniqueness is enforced). Stored per Ticket and returned back under
            Market.DropoffPoint.

        LicensePlate:
          type: string
          example: ABC-1234

        LicensePlateProvince:
          type: string
          example: Bangkok

        VehicleTypeCode:
          type: string
          example: PICKUP

        VehicleTypeName:
          type: string
          example: Pickup truck

        Booths:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GateTicketBoothRequest"

        Dispatch:
          type: boolean
          example: true
    VehicleJob:
      type: object
      properties:
        ticketNo:
