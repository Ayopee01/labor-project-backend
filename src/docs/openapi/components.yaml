    WorkerTicketCompleteRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          description: Confirmed quantities counted by the worker. Every product in the ticket must be sent.
          items:
            type: object
            required:
              - productCode
              - packageCode
              - confirmed_quantity
            properties:
              productCode:
                type: string
                example: "02020300"
              packageCode:
                type: string
                example: "29"
                description: >
                  PackageCode being submitted for this ProductCode. Normally the same
                  PackageCode Gate originally declared. To switch to a different package for
                  this product, set this to the new PackageCode (see
                  GET /api/workers/me/products/{ProductCode}/packages for valid options) and
                  also send original_package_code.
              original_package_code:
                type: string
