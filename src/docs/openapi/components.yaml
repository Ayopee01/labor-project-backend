          type: string
          nullable: true
          enum:
            - Myanmar
            - Cambodia
          example: Myanmar
        work_start_date:
          type: string
          nullable: true
          format: date
          example: 2024-07-15
        phone:
          type: string
          nullable: true
          example: 081-234-5678
        shift:
          $ref: "#/components/schemas/ProfileCardShift"
        current_job:
          allOf:
            - $ref: "#/components/schemas/WorkerCurrentJob"
          nullable: true
          description: Present for assigned, waiting_team, and working statuses. Not included for open_app, ready, or break.
        break_until:
          type: string
          format: date-time
          description: Present only when status is break.
          example: 2026-07-14T05:30:00.000Z
        break_until_unix_ms:
          type: integer
          format: int64
          nullable: true
          description: Same value as break_until, represented as Unix timestamp in milliseconds for countdown timers. Present only when status is break.
          example: 1784007000000
        remaining_break_time:
          type: object
          description: Present only when status is break.
          properties:
            total_seconds:
              type: integer
              example: 420
            minutes:
              type: integer
              example: 7
            seconds:
              type: integer
              example: 0
            text:
              type: string
              example: 7 minutes
    AdminWorkerStatusResponse:
      type: object
      properties:
        full_name:
          type: string
          example: MANY MANY
        worker_code:
          type: string
          nullable: true
          example: MN000115
        shirt_number:
          type: string
          nullable: true
          example: "115"
        image_url:
          type: string
          nullable: true
          example: https://example.com/uploads/workers/mn000115.jpg
        shift_name:
          type: string
          nullable: true
          example: Morning shift
        latest_activity_at:
          type: string
          nullable: true
          format: date-time
          description: Latest timestamp from the current worker flow step, such as app heartbeat, queue ready time, assignment accepted/scanned time, or latest status update.
          example: 2026-07-12T14:40:07.759Z
        status_entered_at:
          type: string
          nullable: true
          format: date-time
          description: Timestamp used to sort workers inside the current status column. open_app uses status update or heartbeat time, ready uses ready time, assigned uses accepted/assignment time, working uses scanned/work time, and break uses break start time.
          example: 2026-07-12T14:35:00.000Z
        queue_position:
          type: integer
          nullable: true
          description: One-based Redis ready queue position. Only set for ready workers.
          example: 1
        socket_connected:
          type: boolean
          description: True when the worker currently has an open Worker WebSocket connection. Ready or assigned workers can remain visible with false after a network disconnect.
          example: false
        status:
          type: string
          description: The only board status returned by this API. UI maps this value to a column.
          enum:
            - open_app
            - ready
            - assigned
            - waiting_team
            - working
            - break
          example: ready
    AdminWorkerStatusListResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            total:
              type: integer
            open_app:
              type: integer
            ready:
              type: integer
            assigned:
              type: integer
            waiting_team:
              type: integer
            working:
              type: integer
            break:
              type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminWorkerStatusResponse"
    AdminForceWorkerStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - open_app
            - ready
            - break
          example: open_app
        reason:
          type: string
          example: Worker contacted admin for status correction.
    AdminForceWorkerStatusResponse:
      type: object
      properties:
        Message:
          type: string
          example: Worker status forced successfully.
        FullName:
          type: string
          example: MANY MANY
        WorkerCode:
          type: string
          nullable: true
          example: MN000115
        Status:
          type: string
          enum:
            - open_app
            - ready
            - assigned
            - waiting_team
            - working
            - break
          example: open_app
