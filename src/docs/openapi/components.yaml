              example: null
            accept_deadline_at:
              type: string
              nullable: true
              format: date-time
              description: Deadline by which the worker must accept before the assignment times out. Null when the assignment is not PENDING.
              example: 2026-07-12T14:32:00.000Z
            accept_deadline_unix_ms:
              type: integer
              nullable: true
              description: Same deadline as accept_deadline_at, represented as Unix timestamp in milliseconds for countdown timers.
              example: 1752330720000
            scan_deadline_at:
