          type: string
          nullable: true
          example: MN000115
        name:
          type: string
          example: Worker Name
        shirt:
          type: string
          nullable: true
          example: "4"

    DailyWorkerIncomeCancellation:
      type: object
      nullable: true
      description: >-
        Non-null only when payment_status = cancel (the whole ticket_no was cancelled by an
        Admin). cancelled_by_type/cancelled_by_name come from the
        admin_action_logs row written when the ticket_no was cancelled.
      properties:
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancelled_by_type:
          type: string
          nullable: true
          example: admin
        cancelled_by_name:
          type: string
          nullable: true
          example: Admin 9705

    DailyWorkerIncomePaymentStatus:
      type: string
      description: >-
        Mutually exclusive — decided in this priority order: cancel (ticket_no cancelled by
        Admin) > success/partially_paid (ticket_no reached COMPLETED) > admin_reject/worker_reject
        (a booth is currently REJECT, unresolved). A row that matches none of these five is
        excluded from data entirely (e.g. ticket_no still WORKING with no reject and this worker
        never cancelled) — not returned with a null/empty payment_status.
      enum:
        - success
        - partially_paid
        - cancel
        - admin_reject
        - worker_reject

    DailyWorkerIncomeItem:
      type: object
      description: >-
        One Worker's membership (TicketWorker) in one Business Ticket (ticket_no). payable is
        TicketWorker.final_earning_amount taken as-is, never recomputed — already scoped to this
        one ticket_no since TicketWorker is unique per (marketJobId, workerAccountId).
      properties:
        worker:
          $ref: "#/components/schemas/DailyWorkerIncomeWorker"
        accepted_at:
          type: string
          format: date-time
          nullable: true
        shift:
          type: integer
          nullable: true
        ticket_no:
          type: string
          example: TKT-20260723-000125
        plate:
          type: string
          example: ABC-1234
        payable:
          type: string
          example: "12.00"
        scanned_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            VehicleJob.workStartedAt — the moment the whole team finished scanning in. Same value
            for every worker on the same truck, not this worker's own scanned_at.
        submitted_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Latest submission time across every booth in this ticket_no, regardless of which
            worker submitted — same value for every row of the same ticket_no, like confirmedAt.
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        released_at:
          type: string
          format: date-time
          nullable: true
        payment_status:
          $ref: "#/components/schemas/DailyWorkerIncomePaymentStatus"
        cancellation:
          $ref: "#/components/schemas/DailyWorkerIncomeCancellation"
        riskText:
          type: string
          description: >-
            Derived display text for risk/exception events in this row. Multiple messages are
            joined with ", ". Returns "-" when no event applies.
          example: Admin ส่งยอดแทน, ระบบตัดยืนยัน

