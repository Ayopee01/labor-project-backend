        workers:
          type: array
          items:
            $ref: "#/components/schemas/AdminFinancialWorkerPayment"

    AdminHistoryBooth:
      description: Booth (GateTicket) inside a Work History Business Ticket. Reuses the same persisted financial fields as AdminFinancialBooth (not recalculated) plus submission/rejection tracking the /financials endpoint does not need — omits ticket_id/ticket_no/marketCode/marketName since those are already available one level up on AdminHistoryMarket.
      type: object
      properties:
        boothCode:
          type: string
          example: OM3/40
        boothName:
          type: string
          nullable: true
          example: Vendor A
        status:
          type: string
          example: COMPLETED
        cancellation:
          allOf:
            - $ref: "#/components/schemas/AdminHistoryCancellation"
          description: Set when this booth's status is CANCELLED. If this specific booth has no STALL_JOB_CANCELLED log of its own (it was cancelled indirectly by cancelling the whole market or vehicle job), this falls back to that market's or vehicle job's cancel log instead.
        financialized:
          type: boolean
          example: true
        final_stall_amount:
          type: string
          nullable: true
          example: "34.00"
        completed_at:
          type: string
          format: date-time
          nullable: true
        summary:
          type: object
          properties:
            labor_fee_raw:
              type: string
              example: "12.6000"
            worker_payout_total:
              type: string
              example: "12.00"
            fund_amount:
              type: string
              example: "0.6000"
        workers:
          type: array
          items:
            $ref: "#/components/schemas/AdminFinancialBoothWorker"
        products:
          type: array
          items:
            $ref: "#/components/schemas/AdminHistoryProduct"
        vendor_line_id:
          type: string
          nullable: true
        submitted_by_codes:
          type: array
          items:
            type: string
          description: Distinct account codes (Worker or Admin submitting on behalf) that submitted counts for this booth.
        submitted_by_role:
          type: string
          nullable: true
          enum:
            - worker
            - admin
          description: Role of the account that submitted the latest count for this booth.
        latest_submitted_by_code:
          type: string
          nullable: true
          description: Account code of whoever submitted the latest count for this booth — distinct from submitted_by_codes, which is a de-duped set of everyone who ever submitted and does not identify the latest submitter.
        latest_submitted_by_name:
          type: string
          nullable: true
        submission_worker_snapshot:
          type: array
          description: Worker roster that was still WORKING at the exact moment the latest submission was created (SubmissionWorkerSnapshot). Distinct from the booth's Confirm-time roster — if the team changed between the worker submitting the count and the vendor confirming it, the two will differ. Empty array when there is no submission yet.
          items:
            type: object
            properties:
              worker_code:
                type: string
                nullable: true
                example: W000012
              full_name:
                type: string
                example: Somchai Jaidee
        submitted_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the latest submission.
        confirmedAt:
          type: string
          format: date-time
          nullable: true
          description: Vendor confirmation timestamp of the latest submission. Always set once resolved, whether the vendor confirmed manually or the BullMQ timeout auto-confirmed it.
        confirmed_by_type:
          type: string
          nullable: true
          enum:
            - vendor
            - timeout
          description: How the latest submission was resolved — "vendor" when confirmed manually via LINE, "timeout" when auto-confirmed by the BullMQ timeout. Null when never confirmed.
        rejection_history:
          type: array
          items:
            $ref: "#/components/schemas/AdminHistoryRejection"
        company_share_rate:
          type: string
          description: (fund_amount / labor_fee_raw) * 100 from the same finalized financial snapshot. "0.00" when labor_fee_raw is 0.
          example: "4.76"
        worker_count:
          type: integer
          nullable: true
          description: Count of TicketWorker rows with status WORKING at the exact moment the latest submission was created (TicketCompletionSubmission.worker_count_snapshot). Distinct from the current roster, from GateTicketWorkerSnapshot (Confirm-time), and from Financial worker_count. Null when there is no submission yet, or the latest submission predates this feature (never falls back to counting the current roster).
          example: 3

    AdminHistoryMarket:
      type: object
      description: One Business Ticket (MarketJob) inside a Work History vehicle job, with its booths formatted as AdminHistoryBooth.
      properties:
        ticket_no:
          type: string
          example: TKT-20260723-000125
        marketCode:
          type: string
          example: "1123"
        marketName:
          type: string
          example: Market A
        dropoff_point:
          type: string
          nullable: true
        status:
          type: string
          example: COMPLETED
        cancellation:
          allOf:
            - $ref: "#/components/schemas/AdminHistoryCancellation"
          description: Set when this market's status is CANCELLED. If this specific market has no MARKET_JOB_CANCELLED log of its own (it was cancelled indirectly by cancelling the whole vehicle job), this falls back to the vehicle job's cancel log instead.
        booths:
          type: array
          items:
            $ref: "#/components/schemas/AdminHistoryBooth"

    AdminHistoryCancellation:
      type: object
      nullable: true
      description: Cancellation details, reused for VehicleJob-, MarketJob-, GateTicket/Booth-, and per-worker-level cancellation. Null when that level's status is not CANCELLED. When status is CANCELLED but no matching AdminActionLog can be found, the sub-fields are null rather than guessed.
      properties:
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        reason_code:
          type: string
          nullable: true
        reason_text:
          type: string
          nullable: true
        cancelled_by_type:
          type: string
          nullable: true
          description: Role of the admin actor who cancelled (AdminActionLog.actor_role).
        cancelled_by_name:
          type: string
          nullable: true

    AdminHistoryWorker:
      type: object
      description: One worker who actually accepted a dispatch (VehicleJobAssignment.accepted_at not null) for this vehicle job, deduplicated by worker_account_id — the assignment with the latest accepted_at is chosen when the same worker was dispatched/accepted more than once. Workers who were dispatched but never accepted are excluded here but still appear in the timeline.
      properties:
        worker_account_id:
          type: integer
          description: Stable identity for joining with finance.workers[] and other reports — never join by name or shirt number.
        assignment_id:
          type: integer
          description: The accepted VehicleJobAssignment chosen to represent this worker's row.
        worker_code:
          type: string
          nullable: true
          example: MN000115
        full_name:
          type: string
          example: Worker Name
        shirt_number:
          type: string
          nullable: true
          example: "4"
        accepted_at:
          type: string
          format: date-time
          nullable: true
        scanned_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
          description: A worker is considered to have started work as soon as they accept the assignment; this mirrors accepted_at.
        submitted_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the latest booth submission tied to the selected assignment (TicketCompletionSubmission.assignment_id), not any submission by this worker elsewhere in the job. Null when no submission could be reliably attributed to this work-cycle.
        released_at:
          type: string
          format: date-time
          nullable: true
        final_status:
          type: string
          example: COMPLETED
        cancellation:
          $ref: "#/components/schemas/AdminHistoryCancellation"

    AdminHistoryTimelineItem:
      type: object
      description: >
        One event on the vehicle job's chronological timeline, merged from WorkerAssignmentEvent,
        TicketCompletionSubmission, and AdminActionLog and sorted by occurred_at. COUNT_SUBMITTED
        entries have actor_type "admin" (instead of "worker") when the submission came from
        POST .../override-count instead of the worker's own submit-count flow.
      properties:
        type:
          type: string
          enum:
            - GATE_ARRIVAL
            - WORKER_ASSIGNED
            - WORKER_ACCEPTED
            - WORKER_SCANNED
            - WORKER_ACCEPT_TIMEOUT
            - WORKER_SCAN_TIMEOUT
            - WORKER_COMPLETED
            - WORKER_RELEASED
            - COUNT_SUBMITTED
            - TICKET_REJECTED
            - TICKET_CONFIRMED
            - ADMIN_ACTION
            - JOB_COMPLETED
        occurred_at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum:
            - worker
            - admin
            - system
        actor_name:
          type: string
          nullable: true
        description:
          type: string

    AdminHistoryFinance:
      type: object
      description: Job-level finance totals for the whole vehicle job (all Business Tickets), summed from the same persisted TicketProductFinancial/TicketWorkerPayment values as AdminFinancialBooth. Never recalculated from a formula.
      properties:
        stall_fee_total:
          type: string
          example: "34.00"
        labor_fee_total:
          type: string
          example: "12.6000"
        total_worker_share:
          type: string
          example: "12.00"
        fund_amount:
          type: string
          example: "0.6000"
        worker_count:
          type: integer
          description: Count of distinct workers who actually accepted a dispatch — same set as workers[] below and as the vehicle_job history workers[] (AdminHistoryWorker).
          example: 1
        workers:
          type: array
          description: Real per-worker earnings across every Business Ticket of this vehicle job (sum of TicketWorker.final_earning_amount per worker). Never averaged. Same deduplicated accepted-worker set as vehicle_job history workers[] — a worker who accepted but has no earnings yet still gets one row with total_amount "0.00".
          items:
            type: object
            properties:
              worker_account_id:
                type: integer
                description: Join key with vehicle_job history workers[] — never join by name.
              worker_code:
                type: string
                nullable: true
              full_name:
                type: string
              total_amount:
                type: string
                example: "220.00"

    AdminVehicleJobHistoryItemResponse:
      type: object
      properties:
        vehicle_job:
          allOf:
            - $ref: "#/components/schemas/AdminVehicleJobListItem"
            - type: object
              properties:
                ticket_created_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Earliest ticket_created_at across every Business Ticket (MarketJob) of this vehicle job. This is the time Gate created the first Ticket.
                work_started_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: VehicleJob.work_started_at. Set once when the whole Worker team finishes scanning and the vehicle job starts WORKING.
                submitted_complete_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Latest booth submission timestamp. Set only when every non-cancelled Business Ticket has at least one submission.
                completed_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: VehicleJob.completed_at. Set once when the central lifecycle changes the vehicle job to COMPLETED.
                duration_seconds:
                  type: integer
                  nullable: true
                  description: CompletedAt minus WorkStartedAt, in seconds. Null unless both are known.
                history_status:
                  type: string
                  nullable: true
                  enum:
                    - COMPLETED
                    - CANCELLED
                    - REJECT_PENDING
                  description: >-
                    The Work History business group this vehicle job belongs to (see the
                    history_status query parameter). Priority is CANCELLED > COMPLETED >
                    REJECT_PENDING. Null when the vehicle job matches none of the three groups
                    (e.g. still WAIT/WORKING with no Booth currently in REJECT) — this can only
                    happen when history_status was not sent, since sending it restricts results to
                    the three groups already.
                history_flags:
                  type: array
                  description: >-
                    Notable past events for this vehicle job, distinct from history_status (the
                    current business group) — a job can have any number of these at once, except
                    VEHICLE_CANCELLED_AFTER_START and VEHICLE_CANCELLED_BEFORE_START which are
                    mutually exclusive. Always an array (never null, empty array when nothing
                    matched), never contains duplicates, and is ordered as listed in the enum below
                    regardless of when each event actually occurred. Derived entirely from existing
                    transactional data (TicketCompletionSubmission, VehicleJobAssignment,
                    WorkerAssignmentEvent, GateTicket) — never parsed from Timeline[].description.
                    Backend sends only these stable English codes; translating to Thai text/icons/
                    colors is a Frontend concern.
                  items:
                    type: string
                    enum:
                      - FINANCE_CALCULATED
                      - WORKERS_RELEASED
                      - BOOTH_REJECTED
                      - AUTO_CONFIRMED
                      - WORKER_CHANGED_DURING_JOB
                      - SUBMISSION_ROSTER_INCOMPLETE
                      - ADMIN_SUBMITTED_ON_BEHALF
                      - VEHICLE_CANCELLED_AFTER_START
                      - VEHICLE_CANCELLED_BEFORE_START
                  example:
                    - FINANCE_CALCULATED
                    - WORKERS_RELEASED
                    - BOOTH_REJECTED
                cancellation:
                  allOf:
                    - $ref: "#/components/schemas/AdminHistoryCancellation"
                  description: Set when this vehicle job's status is CANCELLED (VEHICLE_JOB_CANCELLED). This is the top level, so there is no further fallback.
        markets:
          type: array
          items:
            $ref: "#/components/schemas/AdminHistoryMarket"
        workers:
          type: array
          items:
            $ref: "#/components/schemas/AdminHistoryWorker"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/AdminHistoryTimelineItem"
        finance:
          $ref: "#/components/schemas/AdminHistoryFinance"

    AdminOverrideCountItemRequest:
      type: object
      required:
        - productCode
        - packageCode
        - actual_quantity
      properties:
        productCode:
          type: string
          example: "02020300"
        packageCode:
          type: string
          example: "29"
        actual_quantity:
          type: number
          minimum: 0
          example: 7

    AdminOverrideCountRequest:
      type: object
      required:
        - reason_code
        - counts
      properties:
        reason_code:
          type: string
          description: Required, must not be empty.
          example: R001
        reason_text:
          type: string
          nullable: true
          description: Optional override reason text.
          example: Worker entered the wrong count.
        counts:
          type: array
          minItems: 1
          description: Every product on this booth must be included.
          items:
            $ref: "#/components/schemas/AdminOverrideCountItemRequest"

    AdminOverrideCountItemResponse:
      type: object
      properties:
        productCode:
          type: string
          example: "02020300"
        packageCode:
          type: string
          example: "29"
        previous_quantity:
          type: string
          nullable: true
          example: "10.00"
        confirmed_quantity:
          type: string
          nullable: true
          example: "7.00"

    AdminOverrideCountResponse:
      type: object
      properties:
        message:
          type: string
        ticket_number:
          type: string
          example: TRUCK-20260723-001
        boothCode:
          type: string
          example: OM3/40
        status:
          type: string
          description: DELIVERED on success.
          example: DELIVERED
        reason_code:
          type: string
          example: R001
        reason_text:
          type: string
          nullable: true
          example: Worker entered the wrong count.
        products:
          type: array
          items:
            $ref: "#/components/schemas/AdminOverrideCountItemResponse"

    AdminVehicleWaitRequest:
      type: object
      required:
        - dispatch
        - reason_code
      properties:
        dispatch:
          type: boolean
          description: >
            false puts the vehicle job back to wait (dispatchNow=false) and requeues its team to
            the front of the FIFO queue. true dispatches it again (dispatchNow=true) and calls
            workers from the queue for this vehicle job right away.
          example: false
        reason_code:
          type: string
          description: Required, must not be empty.
          example: DRIVER_NOT_READY
        reason_text:
          type: string
          nullable: true
          description: Optional — may be omitted or sent as null.
          example: Driver requested more time before unloading.

    AdminVehicleWaitResponse:
      type: object
      properties:
        message:
          type: string
        ticket_number:
          type: string
          example: TRUCK-20260723-001
        status:
          type: string
          description: WAIT when dispatch was switched to false, WORKING when switched to true.
          example: WAIT
        dispatch_now:
          type: boolean
          example: false
        requeued_worker_codes:
          type: array
          items:
            type: string
            nullable: true
