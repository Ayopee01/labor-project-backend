      description: Booth (GateTicket) inside a Work History Business Ticket. Extends the same persisted financial fields as AdminFinancialBooth (reused verbatim, not recalculated) with submission/rejection tracking that the /financials endpoint does not need.
      allOf:
        - $ref: "#/components/schemas/AdminFinancialBooth"
        - type: object
          properties:
            vendor_line_id:
              type: string
              nullable: true
            reject_reason:
              type: string
              nullable: true
              description: Latest reject reason on the booth, if any.
            submitted_worker_codes:
              type: array
              items:
                type: string
              description: Distinct worker codes that submitted counts for this booth.
            submitted_at:
              type: string
              format: date-time
              nullable: true
              description: Timestamp of the latest submission.
            confirmedAt:
              type: string
              format: date-time
              nullable: true
              description: Vendor confirmation timestamp of the latest submission.
            rejection_history:
              type: array
              items:
                $ref: "#/components/schemas/AdminHistoryRejection"

