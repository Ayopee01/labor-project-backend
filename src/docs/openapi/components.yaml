          type: string
          description: Worker UI status. Internal queue values are mapped to open_app, ready, assigned, waiting_team, working, or break.
          enum:
            - open_app
            - ready
            - assigned
            - waiting_team
            - working
            - break
          example: break
        today_job_count:
          type: integer
          example: 3
        break_count_used:
          type: integer
          example: 1
        completed_job_count:
          type: integer
          example: 2
