        build_number:
          type: integer
          description: Primary comparison key. Must be unique across all versions.
          example: 10400
        release_at:
          type: string
          format: date-time
          description: Optional. Metadata only (UI/History display) — does not trigger anything.
          example: 2026-08-19T10:00:00.000Z
        android_download_url:
          type: string
          format: uri
          example: https://play.google.com/store/apps/details?id=com.example.worker
        ios_download_url:
          type: string
          format: uri
          example: https://apps.apple.com/app/id0000000000
        release_message:
          type: string
          example: กรุณาอัปเดตแอปแรงงานตามเวลาที่กำหนด
        release_notes:
          type: string
          example: ปรับปรุงระบบรับงานและการแจ้งเตือน
        force_update_at:
          type: string
          format: date-time
          description: Optional. Omit for a version that is never forced. When set (in the future), this version is Scheduled — Worker app checks keep returning the current version until server time reaches this value, at which point it also becomes required. This same value automatically schedules the separate force-update FCM notice for the same moment.
          example: 2026-08-25T15:00:00.000Z
        release_notification_at:
          type: string
          format: date-time
          description: Optional. Omit (or send null) to send the release FCM notice synchronously during this request. Set a future time to schedule it via a delayed BullMQ job instead; must not be later than force_update_at. Neither option ever activates the version early.
          example: 2026-08-20T02:00:00.000Z
    UpdateMobileAppVersionRequest:
      type: object
      description: At least one field is required. version/build_number are only accepted while the version is still Scheduled.
      properties:
        version:
          type: string
          example: "1.4.1"
        build_number:
          type: integer
          example: 10401
        release_at:
          type: string
          format: date-time
        android_download_url:
          type: string
          format: uri
        ios_download_url:
          type: string
          format: uri
        release_message:
          type: string
        release_notes:
          type: string
        force_update_at:
          type: string
          format: date-time
          nullable: true
          description: Set a new time to reschedule the force-update notification and change when the version activates; set to null to remove the force entirely. Only takes effect for the notification while force_update_notification_sent_at is still null — once sent, further edits only update the stored value and never trigger another send.
        release_notification_at:
          type: string
          format: date-time
          nullable: true
          description: Changing this reschedules/resends the release notification, but only while release_notification_sent_at is still null — once sent, further edits here only update the stored value and never trigger another send. Set to null to send immediately (removing any pending delayed job).
