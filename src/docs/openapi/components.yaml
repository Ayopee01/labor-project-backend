          example: false
        status:
          type: string
          description: The only board status returned by this API. UI maps this value to a column.
          enum:
            - open_app
            - ready
            - assigned
            - waiting_team
            - working
            - break
          example: ready
        assignment:
          type: object
          nullable: true
          description: The worker's current vehicle job assignment, or null when the worker has no active assignment.
          properties:
            ticket_number:
