components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gateBasicAuth:
      type: http
      scheme: basic
      description: Gate Client Credentials. Username is client_id and password is client_secret.
  schemas:
    ErrorResponse:
      type: object
      required:
        - statusCode
        - code
        - message
      properties:
        statusCode:
          type: integer
          example: 401
        code:
          type: string
          example: INVALID_TOKEN
        message:
          type: string
          example: Invalid or expired token.
        request_id:
          type: string
          nullable: true
          description: Correlation id for this request. Also echoed in the X-Request-Id response header — include it when reporting an issue so the team can find the matching log line.
          example: 3fa4c1e2-9b7a-4e2f-8a5a-6f1a2b9c3d4e
        shift:
          type: object
          nullable: true
          description: Present on OUTSIDE_WORK_SHIFT errors.
          properties:
            name:
              type: string
              example: Morning shift
            start_time:
              type: string
              example: "06:00"
            end_time:
              type: string
              example: "18:00"
        remaining_time:
          type: string
          nullable: true
          description: Human-readable remaining time until the next shift start. Present on OUTSIDE_WORK_SHIFT errors.
          example: 28 minutes
    Account:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: user01
        role:
          type: string
          enum:
            - admin
            - worker
          example: worker
        status:
          type: string
          enum:
            - active
            - inactive
          example: active
        full_name:
          type: string
          example: Worker Name
        position:
          type: string
          nullable: true
          example: null
        email:
          type: string
          nullable: true
          example: admin@simmummuang.local
        phone:
          type: string
          nullable: true
          example: 081-000-0001
        permission_level:
          type: string
          nullable: true
          enum:
            - owner
            - manager
            - supervisor
          example: null
        created_at:
          type: string
          format: date-time
          example: 2026-07-01T09:00:00.000Z
        updated_at:
          type: string
          format: date-time
          example: 2026-07-01T09:00:00.000Z
    ProfileCardShift:
      type: object
      nullable: true
      properties:
        name:
          type: string
          example: day
        start_time:
          type: string
          example: "06:00"
        end_time:
          type: string
          example: "18:00"
    AdminProfileCard:
      type: object
      properties:
        role:
          type: string
          example: admin
        full_name:
          type: string
          example: Admin Sinummuang
        position:
          type: string
          nullable: true
          example: Administrator
        employee_code:
          type: string
          example: ADM0001
        admin_code:
          type: string
          example: ADM0001
        status:
          type: string
          example: active
        email:
          type: string
          nullable: true
          example: admin@simmummuang.local
        phone:
          type: string
          nullable: true
          example: 081-000-0001
        permission_level:
          type: string
          nullable: true
          example: owner
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/AdminPermission"
        latest_active_at:
          type: string
          nullable: true
          format: date-time
          example: 2026-07-13T02:07:55.618Z
    WorkerProfileCard:
      type: object
      properties:
        role:
          type: string
          example: worker
        full_name:
          type: string
          example: Worker Name
        employee_code:
          type: string
          nullable: true
          example: MN000142
        worker_code:
          type: string
          nullable: true
          example: MN000142
        shirt_number:
          type: string
          nullable: true
          example: "51"
        image_url:
          type: string
          nullable: true
          example: https://example.com/uploads/workers/mn000142.jpg
        nationality:
          type: string
          nullable: true
          enum:
            - Myanmar
            - Cambodia
          example: Myanmar
        work_start_date:
          type: string
          nullable: true
          format: date
          example: 2024-07-15
        phone:
          type: string
          nullable: true
          example: 081-234-5678
        shift:
          $ref: "#/components/schemas/ProfileCardShift"
    AuthProfileCard:
      oneOf:
        - $ref: "#/components/schemas/AdminProfileCard"
        - $ref: "#/components/schemas/WorkerProfileCard"
    AdminMeResponse:
      type: object
      properties:
        role:
          type: string
          example: admin
        full_name:
          type: string
          example: System Admin
        employee_code:
          type: string
          example: ADM0001
        position:
          type: string
          nullable: true
          example: Administrator
        admin_code:
          type: string
          example: ADM0001
        status:
          type: string
          example: active
        email:
          type: string
          nullable: true
          example: admin@simmummuang.local
        phone:
          type: string
          nullable: true
          example: 081-000-0001
        image_url:
          type: string
          nullable: true
          description: Set by POST /api/auth/me/upload-image. Null (never omitted) when the admin has no profile image, so clients can tell "no image" apart from an older response shape without this field.
          example: /uploads/admins/12-1699999999.jpg
        permission_level:
          type: string
          nullable: true
          example: manager
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/AdminPermission"
        lang:
          $ref: "#/components/schemas/AccountLang"
        latest_active_at:
          type: string
          nullable: true
          format: date-time
          example: 2026-07-13T03:18:06.020Z
    WorkerMeResponse:
      type: object
      properties:
        role:
          type: string
          example: worker
        full_name:
          type: string
          example: Worker Name
        employee_code:
          type: string
          nullable: true
          example: MN000142
        worker_code:
          type: string
          nullable: true
          example: MN000142
        image_url:
          type: string
          nullable: true
          example: https://example.com/uploads/workers/mn000142.jpg
        status:
          type: string
          description: Worker UI status. Internal queue values are mapped to open_app, ready, assigned, waiting_team, working, or break.
          enum:
            - open_app
            - ready
            - assigned
            - waiting_team
            - working
            - break
          example: ready
        nationality:
          type: string
          nullable: true
          enum:
            - Myanmar
            - Cambodia
          example: Myanmar
        shirt_type:
          type: string
          nullable: true
          example: Navy
        shirt_number:
          type: string
          nullable: true
          example: "12"
        work_start_date:
          type: string
          nullable: true
          format: date
          example: 2024-07-15
        phone:
          type: string
          nullable: true
          example: 081-234-5678
        lang:
          $ref: "#/components/schemas/AccountLang"
        shift:
          $ref: "#/components/schemas/ProfileCardShift"
    WorkerProfile:
      type: object
      properties:
        worker_code:
          type: string
          example: MN000142
        image_url:
          type: string
          nullable: true
          example: https://example.com/uploads/workers/mno00142.jpg
        nationality:
          type: string
          enum:
            - Myanmar
            - Cambodia
          example: Myanmar
        work_start_date:
          type: string
          format: date
          example: 2024-07-15
        phone:
          type: string
          example: 081-234-5678
        shirt_type:
          type: string
          nullable: true
          enum:
            - Navy
            - Blue
            - Green
          example: Navy
        shirt_number:
          type: string
          nullable: true
          example: "12"
    WorkSchedule:
      type: object
      properties:
        worker_code:
          type: string
          example: MN000142
        shift_no:
          type: integer
          enum:
            - 1
            - 2
          description: Current shift order for the worker.
          example: 1
        work_date:
          type: string
          format: date
          example: 2026-07-01
        shift_start_time:
          type: string
          description: Time only in HH:mm. This is a daily recurring shift time.
          pattern: "^\\d{2}:\\d{2}$"
          example: "08:00"
        shift_end_time:
          type: string
          description: Time only in HH:mm. This is a daily recurring shift time.
          pattern: "^\\d{2}:\\d{2}$"
          example: "17:00"
        shift_name:
          type: string
          example: day
        is_current:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: 2026-07-01T09:00:00.000Z
        updated_at:
          type: string
          format: date-time
          example: 2026-07-01T09:00:00.000Z
    AuthenticatedAccount:
      oneOf:
        - $ref: "#/components/schemas/AdminMeResponse"
        - $ref: "#/components/schemas/WorkerMeResponse"
    AccountLang:
      type: string
      enum:
        - TH
        - MN
        - CN
        - EN
      example: TH
    UpdateAccountLangRequest:
      type: object
      required:
        - lang
      properties:
        lang:
          $ref: "#/components/schemas/AccountLang"
    UpdateAccountLangResponse:
      type: object
      properties:
        message:
          type: string
          example: Language updated successfully.
        lang:
          $ref: "#/components/schemas/AccountLang"
    UpdateOwnProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          description: Must stay a non-empty string when sent — cannot be cleared. Omit to leave unchanged.
        email:
          type: string
          nullable: true
          description: Omit to leave unchanged. Send null to clear the stored email. An empty string is also treated as "leave unchanged" (not as clear) — send null explicitly to clear.
        phone:
          type: string
          nullable: true
          description: Omit to leave unchanged. Send null to clear the stored phone. An empty string is also treated as "leave unchanged" (not as clear) — send null explicitly to clear.
      description: All fields optional. Only fields actually sent (present in the JSON body) are updated. Admin-only (role-gated).
    UploadOwnProfileImageResponse:
      type: object
      properties:
        message:
          type: string
          example: Profile image uploaded successfully.
        image_url:
          type: string
          example: /uploads/admins/1690000000000-a1b2c3d4.jpg
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: user01
        password:
          type: string
          format: password
          example: "123456"
        device_id:
          type: string
          description: Required for worker login. Omit for admin login. PascalCase body key DeviceId is also accepted.
          example: browser-device-id
        device_name:
          type: string
          description: Required when the account role is worker. Omit for admin login. PascalCase body key DeviceName is also accepted.
          example: Chrome on Windows
        fcm_token:
          type: string
          description: Optional for worker login. Mobile FCM registration token from Firebase SDK, used for background push notifications. PascalCase body key FcmToken is also accepted. If unavailable during login, call POST /api/auth/push-token after login.
          example: fcm-registration-token
        platform:
          type: string
          description: Optional push token platform. PascalCase body key Platform is also accepted. Defaults to unknown when omitted.
          enum:
            - android
            - ios
            - web
            - unknown
          example: android
    ConfirmForceLoginRequest:
      type: object
      required:
        - login_challenge_token
        - device_id
        - device_name
      properties:
        login_challenge_token:
          type: string
          example: temporary-jwt-token
        device_id:
          type: string
          example: browser-device-id
        device_name:
          type: string
          example: Chrome on Windows
        fcm_token:
          type: string
          description: Optional worker FCM registration token for the new forced-login session. PascalCase body key FcmToken is also accepted. If unavailable during force login, call POST /api/auth/push-token after this request succeeds.
          example: fcm-registration-token
        platform:
          type: string
          enum:
            - android
            - ios
            - web
            - unknown
          example: android
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: refresh-jwt-token
    ChangeOwnPasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
          example: Admin@123456
        new_password:
          type: string
          format: password
          example: Admin@654321
    ChangeOwnPasswordResponse:
      type: object
      properties:
        message:
          type: string
          example: Password changed successfully.
    AuthSuccessResponse:
      type: object
      properties:
        access_token:
          type: string
          example: access-jwt-token
        refresh_token:
          type: string
          example: refresh-jwt-token
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
    RefreshSuccessResponse:
      type: object
      properties:
        access_token:
          type: string
          example: access-jwt-token
        refresh_token:
          type: string
          example: refresh-jwt-token
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
    LoginConflictResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            code:
              type: string
              example: ACTIVE_SESSION_EXISTS
            login_challenge_token:
              type: string
              example: temporary-jwt-token
            active_device:
              type: object
              properties:
                device_id:
                  type: string
                  example: old-browser-device-id
                device_name:
                  type: string
                  example: Safari on iPhone
                last_active_at:
                  type: string
                  format: date-time
                  example: 2026-07-01T09:00:00.000Z
    LogoutSuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: Logged out successfully.
    ActionMessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Action completed successfully.
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 125
        total_pages:
          type: integer
          example: 7
    WorkerProfileInput:
      type: object
      required:
        - nationality
        - work_start_date
      properties:
        image_url:
          type: string
          nullable: true
          example: https://example.com/uploads/workers/mno00142.jpg
        nationality:
          type: string
          enum:
            - Myanmar
            - Cambodia
          example: Myanmar
        work_start_date:
          type: string
          format: date
          example: 2024-07-15
        shirt_type:
          type: string
          enum:
            - Navy
            - Blue
            - Green
          example: Navy
        shirt_number:
          type: string
          example: "12"
    UpdateWorkerProfileInput:
      type: object
      properties:
        image_url:
          type: string
          nullable: true
          example: https://example.com/uploads/workers/mno00142-updated.jpg
        nationality:
          type: string
          enum:
            - Myanmar
            - Cambodia
          example: Myanmar
        work_start_date:
          type: string
          format: date
          example: 2024-07-15
        shirt_type:
          type: string
          enum:
            - Navy
            - Blue
            - Green
          example: Navy
        shirt_number:
          type: string
          example: "12"
    CreateUserRequest:
      type: object
      required:
        - full_name
        - phone
        - nationality
        - shirt_type
        - shirt_number
        - shift_no
      properties:
        username:
          type: string
          description: Optional. If omitted, backend uses worker_code generated from nationality + shirt_type + shirt_number, for example MN000004.
          example: MN000004
        img:
          type: string
          description: Optional image URL from the UI. Stored as image_url.
          example: https://example.com/uploads/workers/worker001.jpg
        full_name:
          type: string
          example: Worker One
        phone:
          type: string
          description: Saved to accounts.phone. The initial worker password is the hashed value of this phone.
          example: "0812345678"
        nationality:
          type: string
          enum:
            - Myanmar
            - Cambodia
          example: Myanmar
        shirt_type:
          type: string
          enum:
            - Navy
            - Blue
            - Green
          example: Navy
        shirt_number:
          type: string
          description: Unique. Used with nationality and shirt_type to generate worker_code and default username.
          example: "4"
        work_start_date:
          type: string
          format: date
          description: Optional first working date for the worker profile. If omitted, backend uses the current Bangkok date.
          example: 2026-07-03
        shift_no:
          type: integer
          enum:
            - 1
            - 2
          description: Required. 1 = morning shift preset 08:00-18:00, 2 = evening shift preset 18:00-08:00.
          example: 1
        status:
          type: string
          enum:
            - active
            - inactive
          default: active
          example: active
    CreateUserMultipartRequest:
      type: object
      required:
        - full_name
        - phone
        - nationality
        - shirt_type
        - shirt_number
        - shift_no
      properties:
        image:
          type: string
          format: binary
          description: "Optional worker profile image. Allowed types: jpg, png, webp. Max size: 5 MB."
        username:
          type: string
          description: Optional. If omitted, backend uses worker_code generated from nationality + shirt_type + shirt_number, for example MN000004.
          example: MN000004
        full_name:
          type: string
          example: Worker One
        phone:
          type: string
          description: Saved to accounts.phone. The initial worker password is the hashed value of this phone.
          example: "0812345678"
        nationality:
          type: string
          enum:
            - Myanmar
            - Cambodia
          example: Myanmar
        shirt_type:
          type: string
          enum:
            - Navy
            - Blue
            - Green
          example: Navy
        shirt_number:
          type: string
          description: Unique. Used with nationality and shirt_type to generate worker_code and default username.
          example: "4"
        work_start_date:
          type: string
          format: date
          description: Optional first working date for the worker profile. If omitted, backend uses the current Bangkok date.
          example: 2026-07-03
        shift_no:
          type: integer
          enum:
            - 1
            - 2
          description: Required. 1 = morning shift preset 08:00-18:00, 2 = evening shift preset 18:00-08:00.
          example: 1
        status:
          type: string
          enum:
            - active
            - inactive
          default: active
          example: active
    UpdateUserRequest:
      type: object
      properties:
        worker_code:
          type: string
          description: Optional. If omitted and nationality, shirt_type, or shirt_number is sent, backend regenerates worker_code and username from nationality + shirt_type + shirt_number using existing profile values for fields omitted from the request.
          example: MN000115
        image_url:
          type: string
          nullable: true
          example: https://example.com/uploads/workers/mn000115.jpg
        img:
          type: string
          nullable: true
          description: Optional alias for image_url.
          example: https://example.com/uploads/workers/mn000115.jpg
        full_name:
          type: string
          example: Worker Name
        phone:
          type: string
          example: "0811111111"
        nationality:
          type: string
          enum:
            - Myanmar
            - Cambodia
          example: Myanmar
        position:
          type: string
          nullable: true
          example: Worker
        shirt_type:
          type: string
          nullable: true
          enum:
            - Navy
            - Blue
            - Green
          example: Navy
        shirt_number:
          type: string
          nullable: true
          description: Unique. If worker_code is omitted, backend regenerates worker_code and username from nationality + shirt_type + shirt_number.
          example: "115"
        work_start_date:
          type: string
          format: date
          description: Optional first working date for the worker profile.
          example: 2026-07-03
        shift_start_time:
          type: string
          description: Optional custom time for this worker. Must be sent together with shift_end_time. Time only in HH:mm. Backend derives ShiftNo and ShiftName from this start time.
          pattern: "^\\d{2}:\\d{2}$"
          example: "18:00"
        shift_end_time:
          type: string
          description: Optional custom time for this worker. Must be sent together with shift_start_time. Time only in HH:mm.
          pattern: "^\\d{2}:\\d{2}$"
          example: "08:00"
        profile:
          description: Backward compatible nested profile update.
          $ref: "#/components/schemas/UpdateWorkerProfileInput"
        status:
          type: string
          description: Optional. Updates the worker account status.
          enum:
            - active
            - inactive
          example: active
    ResetPasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          format: password
          example: NewPassword@123456
    UserListItem:
      type: object
      properties:
        worker_code:
          type: string
          nullable: true
          example: MN000004
        shirt_number:
          type: string
          nullable: true
          example: "4"
        full_name:
          type: string
          example: Worker Name
        phone:
          type: string
          nullable: true
          example: "0812345678"
        work_start_date:
          type: string
          nullable: true
          format: date
          description: Optional first working date for the worker profile.
          example: 2026-07-03
        work_schedule:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserListSchedule"
        status:
          type: string
          enum:
            - active
            - inactive
          example: active
        updated_at:
          type: string
          format: date-time
          example: 2026-07-01T09:00:00.000Z
    UserListSchedule:
      type: object
      properties:
        shift_no:
          type: integer
          enum:
            - 1
            - 2
          example: 1
        shift_start_time:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
          description: Time only in HH:mm. This is a daily recurring shift time.
          example: "08:00"
        shift_end_time:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
          description: Time only in HH:mm. This is a daily recurring shift time.
          example: "17:00"
        shift_name:
          type: string
          example: Morning shift
    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserListItem"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    SessionInfo:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          example: 5
        device_id:
          type: string
          example: browser-device-id
        device_name:
          type: string
          example: Chrome on Windows
        last_active_at:
          type: string
          format: date-time
          example: 2026-07-01T09:00:00.000Z
    UserDetailResponse:
      type: object
      properties:
        image_url:
          type: string
          nullable: true
          example: https://example.com/uploads/workers/mn000115.jpg
        worker_code:
          type: string
          nullable: true
          example: MN000115
        full_name:
          type: string
          example: MANY MANY
        status:
          type: string
          enum:
            - active
            - inactive
          example: active
        details:
          type: object
          properties:
            phone:
              type: string
              nullable: true
              example: "0811111111"
            position:
              type: string
              nullable: true
              example: Worker
            nationality:
              type: string
              nullable: true
              enum:
                - Myanmar
                - Cambodia
              example: Myanmar
            shirt_number:
              type: string
              nullable: true
              example: "115"
            shirt_type:
              type: string
              nullable: true
              enum:
                - Navy
                - Blue
                - Green
              example: Navy
            work_start_date:
              type: string
              nullable: true
              format: date
              description: Optional first working date for the worker profile.
              example: 2026-07-03
            shift_no:
              type: integer
              nullable: true
              enum:
                - 1
                - 2
              example: 1
            shift_start_time:
              type: string
              nullable: true
              description: Time only in HH:mm. This is a daily recurring shift time.
              example: "08:00"
            shift_end_time:
              type: string
              nullable: true
              description: Time only in HH:mm. This is a daily recurring shift time.
              example: "17:00"
            shift_name:
              type: string
              nullable: true
              example: Morning shift
