          type: string
          nullable: true
          enum:
            - Myanmar
            - Cambodia
          example: Myanmar
        work_start_date:
          type: string
          nullable: true
          format: date
          example: 2024-07-15
        phone:
          type: string
          nullable: true
          example: 081-234-5678
        shift:
          $ref: "#/components/schemas/ProfileCardShift"
        shift_active:
          type: boolean
          description: >
            True only when BOTH conditions hold: (1) the worker is currently inside their
            assigned shift time window — the same condition POST /api/workers/me/online checks
            before throwing 403 OUTSIDE_WORK_SHIFT — and (2) the worker still has eligibility for
            this shift instance per their WorkerShiftAttendance record (has not already ended/
            closed this shift). Being inside the shift time alone is not enough — a worker who
            already ended their shift shows false immediately, without waiting for the shift time
            window itself to end. Lets the app enable/disable the Online button without
            recomputing either check itself.
          example: true
        current_job:
          allOf:
            - $ref: "#/components/schemas/WorkerCurrentJob"
          nullable: true
          description: Present for assigned, waiting_team, and working statuses. Not included for open_app, ready, or break.
        break_until:
          type: string
          format: date-time
          description: Present only when status is break.
          example: 2026-07-14T05:30:00.000Z
        break_until_unix_ms:
          type: integer
          format: int64
          nullable: true
          description: Same value as break_until, represented as Unix timestamp in milliseconds for countdown timers. Present only when status is break.
          example: 1784007000000
        remaining_break_time:
          type: object
          description: Present only when status is break.
          properties:
            total_seconds:
              type: integer
              example: 420
            minutes:
              type: integer
              example: 7
            seconds:
              type: integer
              example: 0
            text:
              type: string
              example: 7 minutes
