          type: string
        ticket_number:
          type: string
          example: TRUCK-20260723-001
        released_worker_codes:
          type: array
          items:
            type: string
            nullable: true
          description: Ordered by accepted_at (earliest accept first) — the same relative order the team joined the queue with, not the order their assignments were created/dispatched.
          example:
            - MN000115
        reason_code:
          type: string
          example: ALL_BOOTHS_RESOLVED
        reason_text:
          type: string
          nullable: true

