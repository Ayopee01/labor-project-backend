      description: One resolved-or-pending rejection of a booth submission, derived from TicketCompletionSubmission rows in submitted order.
      properties:
        rejectedAt:
          type: string
          format: date-time
        reject_reason:
          type: string
          nullable: true
          description: GateTicket.reject_reason stores only the latest reason text, not a per-event history. This is only populated for the most recent rejection that has not yet been followed by a corrective resubmission; earlier resolved rejections in the same list will have this as null.
        corrected_by_worker_code:
          type: string
          nullable: true
          description: Worker who submitted the next resubmission after this rejection, if any.

