        boothName:
          type: string
          nullable: true
          example: Orange Booth
        status:
          type: string
          example: DELIVERED
        confirmation_status:
          type: string
          example: DELIVERED
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Booth completion time after vendor confirmation or auto-confirm timeout.
          example: "2026-08-14T03:15:42.000Z"
        confirmed_at:
          type: string
          format: date-time
          nullable: true
