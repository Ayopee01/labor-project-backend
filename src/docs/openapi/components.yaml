        release_notification_at:
          type: string
          nullable: true
          format: date-time
          description: When the release FCM notice fires. Null means it is sent immediately (synchronously during POST/PATCH); a future value schedules it via a delayed BullMQ job instead. Sending this notification never activates the version.
