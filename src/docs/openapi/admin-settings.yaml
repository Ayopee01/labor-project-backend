paths:
  /api/admin/settings:
    get:
      tags:
        - Admin Settings
      summary: ดูค่า runtime settings
      description: >
        คืนค่าตั้งค่าระบบที่ backend ใช้กับ queue, timeout, break และการคำนวณต่าง ๆ
      operationId: getAdminSettings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Runtime settings used by backend calculations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSettings"
        "403":
          description: Missing settings:read permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Admin Settings
      summary: แก้ไขค่า runtime settings
      description: >
        Admin แก้ค่าตั้งค่าระบบและบันทึก audit log เพื่อให้ flow ที่อ่าน runtime settings ใช้ค่าล่าสุด
      operationId: updateAdminSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuntimeSettingsRequest"
      responses:
        "200":
          description: Updated runtime settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSettings"
        "400":
          description: Invalid settings payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing settings:update permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/mobile-app-versions:
    get:
      tags:
        - Admin Settings
      summary: ดู version ของ Worker Mobile
      description: >
        คืน Current, Scheduled และ History ของ Worker Mobile โดยคำนวณจาก BuildNumber, ForceUpdateAt และเวลา server สถานะไม่ได้ถูกเก็บตรง ๆ แต่ derive ใหม่ทุกครั้งที่เรียก API
      operationId: listAdminMobileAppVersions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current, Scheduled, and History Mobile App Versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMobileAppVersionOverviewResponse"
        "403":
          description: Missing mobile_app_versions:read permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Admin Settings
      summary: สร้าง version ใหม่ของ Worker Mobile
      description: >
        Admin เพิ่ม version/build ใหม่พร้อม download URL และเวลาประกาศได้ ถ้ามี ForceUpdateAt ระบบจะให้ app version นี้มีผลตามเวลา server และจัดการ FCM notification ตามเวลาที่ตั้งไว้
      operationId: createAdminMobileAppVersion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMobileAppVersionRequest"
      responses:
        "201":
          description: Mobile app version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMobileAppVersionSummary"
        "400":
          description: Invalid payload, or ReleaseNotificationAt is later than ForceUpdateAt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing mobile_app_versions:create permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: BuildNumber already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/mobile-app-versions/{id}:
    patch:
      tags:
        - Admin Settings
      summary: แก้ไข version ของ Worker Mobile
      description: >
        Admin แก้ข้อมูล version, URL, release message และเวลาบังคับอัปเดตได้ Version และ BuildNumber แก้ได้เฉพาะรายการที่ยังเป็น Scheduled ส่วน notification จะถูก sync ใหม่ถ้ายังไม่เคยส่ง
      operationId: updateAdminMobileAppVersion
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Mobile app version id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMobileAppVersionRequest"
      responses:
        "200":
          description: Mobile app version updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMobileAppVersionSummary"
        "400":
          description: Invalid payload, or ReleaseNotificationAt is later than ForceUpdateAt (checked against the merged existing + patched state).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing mobile_app_versions:update permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mobile app version not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: BuildNumber already exists, or Version/BuildNumber was changed after the version is no longer Scheduled (MOBILE_APP_VERSION_LOCKED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/roles:
    get:
      tags:
        - Admin Settings
      summary: ดู role และ permission level ของ Admin
      description: >
        คืนรายการ permission level พร้อมบัญชี Admin ที่อยู่ในแต่ละระดับสำหรับหน้าจัดการสิทธิ์
      operationId: listAdminRoles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin permission levels and admin accounts in each level.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleListResponse"
        "403":
          description: Missing roles:read permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/gate-clients:
    get:
      tags:
        - Admin Settings
      summary: ดูรายการ Gate client
      description: >
        คืน metadata ของ Gate client สำหรับเชื่อมต่อ Gate โดยไม่คืน client secret
      operationId: listAdminGateClients
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Gate client metadata. Secrets are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateClientListResponse"
        "403":
          description: Missing gate_clients:read permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Admin Settings
      summary: สร้าง Gate client ใหม่
      description: >
        Admin สร้าง client_id/client_name สำหรับ Gate และระบบคืน client_secret ให้ดูได้ครั้งเดียว
      operationId: createAdminGateClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGateClientRequest"
      responses:
        "201":
          description: Gate client created. client_secret is shown only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateClientSecretResponse"
        "400":
          description: Invalid Gate client payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing gate_clients:create permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: client_id already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/gate-clients/{clientId}:
    patch:
      tags:
        - Admin Settings
      summary: แก้ไข Gate client
      description: >
        Admin แก้ชื่อหรือสถานะ active/inactive ของ Gate client โดยไม่แตะ client secret
      operationId: updateAdminGateClient
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: string
            example: gate-north
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGateClientRequest"
      responses:
        "200":
          description: Gate client updated. Secrets are not returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateClientMutationResponse"
        "400":
          description: Invalid Gate client payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing gate_clients:update permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gate client not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/gate-clients/{clientId}/secret/rotate:
    post:
      tags:
        - Admin Settings
      summary: เปลี่ยน secret ของ Gate client
      description: >
        สร้าง client_secret ชุดใหม่ให้ Gate client และยกเลิก secret เดิมทันที
      operationId: rotateAdminGateClientSecret
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: string
            example: gate-north
      responses:
        "200":
          description: Secret rotated. client_secret is shown only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateClientSecretResponse"
        "403":
          description: Missing gate_clients:rotate_secret permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gate client not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/admins:
    post:
      tags:
        - Admin Settings
      summary: สร้างบัญชี Admin
      description: >
        Admin ระดับสูงสร้างบัญชี Admin ใหม่ พร้อมกำหนด permission level และสิทธิ์เริ่มต้น
      operationId: createAdminAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminAccountRequest"
      responses:
        "201":
          description: Admin account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdminAccountResponse"
        "400":
          description: Invalid admin payload, or the requested permissions include mobile_app_versions:create/update without mobile_app_versions:read (PERMISSION_DEPENDENCY_NOT_SATISFIED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing admins:create permission, new permission level is equal or higher than the actor, a requested permission the actor does not themselves hold (PERMISSIONS_NOT_GRANTABLE), or a mobile_app_versions:* permission granted by a non-owner actor (OWNER_ONLY_PERMISSIONS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/admins/{id}:
    patch:
      tags:
        - Admin Settings
      summary: แก้ไขข้อมูลพื้นฐานของ Admin อื่น
      description: >
        Admin แก้ full_name, position, email และ phone ของบัญชี Admin ที่มีระดับต่ำกว่าตัวเอง
      operationId: updateAdminAccount
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Admin account id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminAccountRequest"
      responses:
        "200":
          description: Admin account updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAdminAccountResponse"
        "403":
          description: Missing admins:update permission, target is the caller's own account, or target has an equal/higher permission level than the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Admin account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/admins/{id}/password:
    patch:
      tags:
        - Admin Settings
      summary: รีเซ็ตรหัสผ่าน Admin อื่น
      description: >
        ตั้งรหัสผ่านใหม่ให้ Admin เป้าหมาย และยกเลิก session ทั้งหมดของบัญชีนั้น
      operationId: resetAdminPassword
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Admin account id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset. The target's active sessions are revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionMessageResponse"
        "403":
          description: Missing admins:reset_password permission, target is the caller's own account, or target has an equal/higher permission level than the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Admin account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/users/{id}/permissions:
    get:
      tags:
        - Admin Settings
      summary: ดูสิทธิ์ของ Admin หนึ่งคน
      description: >
        ดึง permission, status และ permission level ของ Admin ที่มีระดับต่ำกว่าผู้เรียก
      operationId: getAdminUserPermissions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Admin account id.
      responses:
        "200":
          description: Admin account permissions. The target admin must have a lower permission level than the actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPermissionsResponse"
        "403":
          description: Missing permissions:read permission, self lookup, or target permission level is equal or higher than the actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Admin account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Admin Settings
      summary: แก้ไขสิทธิ์ของ Admin หนึ่งคน
      description: >
        อัปเดต permission, status และ permission level ของ Admin เป้าหมาย แล้ว revoke session เพื่อให้สิทธิ์ใหม่มีผล
      operationId: updateAdminUserPermissions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Admin account id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserPermissionsRequest"
      responses:
        "200":
          description: Admin permissions/status updated. Active sessions for the target admin are revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAdminUserPermissionsResponse"
        "400":
          description: Invalid permissions payload, or the requested permissions include mobile_app_versions:create/update without mobile_app_versions:read (PERMISSION_DEPENDENCY_NOT_SATISFIED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing permissions:update permission, target/new permission level is equal or higher than the actor, a requested permission the actor does not themselves hold (PERMISSIONS_NOT_GRANTABLE), or the request would change the target's mobile_app_versions:* permissions and the actor is not owner-level (OWNER_ONLY_PERMISSIONS) — resubmitting the target's existing mobile_app_versions:* set unchanged is allowed for any actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Admin account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
