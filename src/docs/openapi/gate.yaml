paths:
  /api/gate/options:
    get:
      tags:
        - Gate
      summary: Get Gate master options for Postman / Swagger testing.
      description: >
        Test helper protected by Gate Basic Auth.

        Without MarketCode, the response returns available Markets and
        Products with Packages. Booths is empty.

        With MarketCode, the response returns the selected Market and
        available Booths that can be used for Gate testing. Products is empty.

        This endpoint does not return stall rates, labor rates,
        worker payment, stall payment, or any calculated financial amount.

        PackageWeight is master data used to help construct a valid
        POST /api/gate/tickets request.
      operationId: getGateOptions
      security:
        - gateBasicAuth: []
      parameters:
        - in: query
          name: MarketCode
          required: false
          schema:
            type: string
          example: "1123"
      responses:
        "200":
          description: Gate test helper options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateOptionsResponse"
        "401":
          description: Missing or invalid Gate client credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/gate/tickets:
    post:
      tags:
        - Gate
      summary: Create a Gate ticket using Gate Client Credentials.
      description: >
        Use HTTP Basic Auth where username is ClientId and password is
        ClientSecret.

        Gate sends one PascalCase request per Business Ticket (TicketNo), always
        against exactly one MarketCode. TicketNumber and TicketNo must both be
        exactly 14 digits, numbers only — no letters or special characters.

        A vehicle (TicketNumber) may generate multiple Business Tickets over
        time as it unloads at different markets — send the same TicketNumber
        again with a new TicketNo; no duplicate vehicle job is created.

        TicketNo is scoped to one market. Sending the same TicketNo again
        under the same TicketNumber and the same MarketCode (while that
        Ticket is still active) appends the new Booths[]/Products[] into the
        existing Business Ticket instead of creating a new one — this is how
        Gate reports additional booths discovered later for a market it
        already opened a Ticket for. Appending a BoothCode that already
        exists in that Ticket is rejected with
        GATE_BOOTH_ALREADY_EXISTS_IN_TICKET (no partial-booth merge — send a
        new, non-duplicate BoothCode). Appending into a Ticket whose worker
        roster is already locked (financial finalize already ran) is rejected
        with GATE_TICKET_ROSTER_LOCKED. Sending the same TicketNo again for a
        *different* MarketCode is always rejected with
        GATE_TICKET_ALREADY_EXISTS — TicketNo must never be reused across
        markets while the original Ticket is still active. If a Ticket was
        created with wrong data (wrong market, wrong booth, needs a full
        redo), an Admin must cancel it first (POST /api/admin/jobs/cancel
        with type MARKET_JOB); once cancelled, that exact TicketNo becomes
        free again and Gate can resend it under the same TicketNumber (with
        any MarketCode) to create a brand-new Business Ticket — the cancelled
        Ticket is kept untouched as history, it is never reused or
        overwritten in place.

        One request can contain multiple booths using Booths[] (all in that
        one MarketCode), and each booth can contain multiple products using
        Products[].

        Gate does not send a ticket count. The number of Business Tickets
        under a TicketNumber is simply however many active (non-cancelled)
        Business Tickets exist for it — one per distinct market that still
        has an active Ticket (repeating TicketNo+MarketCode to append more
        booths does not increase this count). There is no "more Tickets
        coming" signal from Gate: intake for a vehicle is considered closed
        as soon as its first Ticket is created. Once every known Business
        Ticket's booths are terminal, the vehicle job completes and its
        workers return to queue automatically. There is no separate "close"
        endpoint.

        Gate must send LicensePlateProvince together with LicensePlate.

        BoothCount must equal Booths.length. BoothCode cannot be duplicated
        inside the same request. ProductCode + PackageCode cannot be duplicated
        inside the same booth.

        Backend resolves MarketName and BoothName from master_market using
        MarketCode + BoothCode.

        Backend resolves ProductFullCode, ProductName, PackageName and
        PackageWeight from master_product using ProductCode + PackageCode.

        Gate Quantity is used only for operational worker requirement and
        dispatch.

        Backend selects the applicable master_rate at Gate Create and stores
        a rate snapshot internally on TicketProduct. The rate snapshot is not
        returned as a calculated payment.

        No financial amount is calculated at Gate Create.

        Stall payment, labor payment, worker payment, remainder and fund are
        calculated only after the worker submits confirmed quantities and the
        ticket is confirmed.

        WorkerCount in each Product is the Master worker requirement for that
        product. Root WorkerCount is this Business Ticket's worker requirement
        used for dispatch: the MAX WorkerCount across every product in every
        booth of this Ticket (not a sum), always recomputed as the MAX between
        the Ticket's current value and this request's own MAX (untouched
        booths keep their already-correct contribution) — the vehicle-level
        total dispatch uses is still the sum of every Business Ticket's own
        MAX under that TicketNumber.

        Backend returns only operational data:
        Result, TicketNumber, Ticket, Market, Booths, WorkerCount and Qr.

        The idempotency key is derived from the full request payload (not just
        TicketNumber + TicketNo), because the same TicketNumber + TicketNo +
        MarketCode can legitimately be sent again with different
        Booths/Products content to append into the same Ticket, and because a
        genuinely new Ticket created after an Admin cancels the previous one
        under the same TicketNo must never be confused with a replay of the
        original (now-cancelled) request.

        Sending the exact same payload again returns REPLAYED. Sending the
        same TicketNumber+TicketNo+MarketCode with different content is
        appended (see above) rather than rejected as a conflict.

        Ticket.Status is derived from Dispatch:
        true = unload_now,
        false = waiting_unload.

        Workers check in by scanning the barcode printed on the physical Gate paper ticket,
        which encodes Ticket.TicketNo — the same value Gate receives in this request, no
        separate QR field is generated or returned. Qr.DriverQrToken stays shared across
        the whole vehicle (TicketNumber) and is unrelated to worker check-in.
      operationId: createGateTicket
      security:
        - gateBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateTicketRequest"
      responses:
        "200":
          description: Existing Gate request replayed by idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateTicketResponse"
        "201":
          description: Gate ticket accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateTicketResponse"
        "400":
          description: Invalid Gate payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Gate client credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Duplicate Gate request, invalid master mapping, duplicate booth/product-package,
            missing required Gate master data, TicketNo reused for a different market while the
            existing Ticket is still active (GATE_TICKET_ALREADY_EXISTS), TicketNo+market reused
            with a BoothCode that already exists in that Ticket
            (GATE_BOOTH_ALREADY_EXISTS_IN_TICKET), or TicketNo+market reused after that Ticket's
            worker roster is already locked (GATE_TICKET_ROSTER_LOCKED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
