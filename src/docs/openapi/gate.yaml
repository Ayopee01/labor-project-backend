paths:
  /api/gate/options:
    get:
      tags:
        - Gate - Test Helper
      summary: Get Gate master options for Postman / Swagger testing.
      description: >
        Test helper protected by Gate Basic Auth.

        Without MarketCode, the response returns available Markets and
        Products with Packages. Booths is empty.

        With MarketCode, the response returns the selected Market and
        available Booths that can be used for Gate testing. Products is empty.

        This endpoint does not return stall rates, labor rates,
        worker payment, stall payment, or any calculated financial amount.

        PackageWeight is master data used to help construct a valid
        POST /api/gate/tickets request.
      operationId: getGateOptions
      security:
        - gateBasicAuth: []
      parameters:
        - in: query
          name: MarketCode
          required: false
          schema:
            type: string
          example: "1123"
      responses:
        "200":
          description: Gate test helper options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateOptionsResponse"
        "401":
          description: Missing or invalid Gate client credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/gate/tickets:
    post:
      tags:
        - Gate
      summary: Create a Gate ticket using Gate Client Credentials.
      description: >
        Use HTTP Basic Auth where username is ClientId and password is
        ClientSecret.

        Gate sends one PascalCase request per TicketNo. One request can contain
        multiple booths using Booths[], and each booth can contain multiple
        products using Products[].

        BoothCount must equal Booths.length. BoothCode cannot be duplicated
        inside the same request. ProductCode + PackageCode cannot be duplicated
        inside the same booth.

        Backend resolves MarketName and BoothName from master_market using
        MarketCode + BoothCode.

        Backend resolves ProductFullCode, ProductName, PackageName and
        PackageWeight from master_product using ProductCode + PackageCode.

        Gate Quantity is used only for operational worker requirement and
        dispatch.

        Backend selects the applicable master_rate at Gate Create and stores
        a rate snapshot internally on TicketProduct. The rate snapshot is not
        returned as a calculated payment.

        No financial amount is calculated at Gate Create.

        Stall payment, labor payment, worker payment, remainder and fund are
        calculated only after the worker submits confirmed quantities and the
        ticket is confirmed.

        WorkerCount in each Product is the Master worker requirement for that
        product. Root WorkerCount is the total worker requirement used for
        dispatch by the current business rule.

        Backend returns only operational data:
        Result, Ticket, Market, Booths, WorkerCount and Qr.

        The idempotency key is derived from TicketNo + MarketCode.

        Sending the same payload again returns REPLAYED. Sending the same
        idempotency key with a different payload returns a conflict.

        Ticket.Status is derived from Dispatch:
        true = unload_now,
        false = waiting_unload.

        Qr.WorkerQrToken uses TicketNo for worker check-in.
      operationId: createGateTicket
      security:
        - gateBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateTicketRequest"
      responses:
        "200":
          description: Existing Gate request replayed by idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateTicketResponse"
        "201":
          description: Gate ticket accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateTicketResponse"
        "400":
          description: Invalid Gate payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Gate client credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate Gate request, invalid master mapping, duplicate booth/product-package, or missing required Gate master data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
